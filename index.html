<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>단원 마무리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="turn-config.js"></script>
<script src="unit.js"></script>
<style>
.wrap{max-width:1100px;margin:0 auto;padding:14px 16px 60px}
/* 첫 화면 */
#home .box{max-width:460px;margin:40px auto 0}
h1{font-size:30px;font-weight:900;text-align:center;margin-bottom:2px}
.sub{text-align:center;color:var(--muted);margin-bottom:22px}
label.small{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
#home input{width:100%;font-size:20px}
#classCode{font-size:34px!important;text-align:center;letter-spacing:12px;font-weight:900}
#classState{margin-top:14px;font-size:15px;color:var(--muted);line-height:1.5;min-height:1.5em}
#classState.ok{color:var(--o);font-weight:700}
/* 상단 */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.top .ttl{font-weight:900;font-size:20px;flex:1}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.pill .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#bbb;margin-right:6px}
.pill .dot.on{background:var(--o)}
.demo-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.demo-tabs button{padding:8px 12px;font-size:15px}
.demo-tabs button.sel{background:var(--acc)}
.phase-h{font-size:24px;font-weight:900;margin:4px 0 4px}
.phase-d{color:var(--muted);margin-bottom:14px}
.wait-msg{text-align:center;padding:80px 20px;color:var(--muted);font-size:22px;font-weight:700}
/* 진단 */
.drow{display:flex;gap:14px;align-items:flex-start}
.drow .no{font-size:28px;font-weight:900;width:38px;flex:none;line-height:1.2}
.drow .mid{flex:1;min-width:0}
.drow .ttl2{font-weight:700}
.drow .ans{margin-top:4px;color:var(--acc);font-weight:700}
.marks{display:flex;gap:8px;flex:none}
.marks button{width:96px;padding:10px 4px;background:#fff;color:var(--ink);border:2px solid var(--line);line-height:1.2}
.marks button b{display:block;font-size:26px}
.marks button span{font-size:13px;font-weight:700}
.marks button.o.sel{background:var(--o-soft);border-color:var(--o);color:var(--o)}
.marks button.t.sel{background:var(--t-soft);border-color:var(--t);color:#9a6d00}
.marks button.x.sel{background:var(--x-soft);border-color:var(--x);color:var(--x)}
.peek{margin-top:6px;font-size:14px;padding:6px 10px}
.pbox{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start;margin-top:10px}
.pbox.nofig{grid-template-columns:1fr}
@media (max-width:860px){ .drow{flex-wrap:wrap} .marks{width:100%} .marks button{flex:1} }
@media (max-width:700px){ .pbox{grid-template-columns:1fr} .pbox .figw{max-width:320px;margin:0 auto} }
/* 힌트 */
.pgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:14px}
.pbtn{background:#fff;color:var(--ink);border:2px solid var(--line);padding:8px 2px;line-height:1.2;position:relative}
.pbtn b{display:block;font-size:26px}
.pbtn small{font-size:12px;font-weight:700;color:var(--muted)}
.pbtn.sel{border-color:var(--acc);background:var(--acc-soft)}
.pbtn.solved small{color:var(--o)}
.hcard{border-left:6px solid var(--acc);background:var(--acc-soft);border-radius:12px;padding:12px 14px;margin-top:10px}
.hcard .hl{font-size:13px;font-weight:900;color:var(--acc);margin-bottom:2px}
.hcard.sol{border-color:var(--o);background:var(--o-soft)}
.hcard.sol .hl{color:var(--o)}
.rule{margin-top:10px;padding-top:8px;border-top:1px dashed #9cc8ad;font-weight:900}
.next{margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.next .cd{color:var(--muted);font-weight:700}
.lockmsg{margin-top:12px;padding:12px 14px;border-radius:12px;background:#f1efe9;color:var(--muted);font-weight:700}
.solvedbar{margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.solvedbar .done{color:var(--o);font-weight:900}
.causes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.causes button{background:#fff;color:var(--ink);border:2px solid var(--line)}
.causes button.sel{border-color:var(--acc);background:var(--acc-soft)}
/* 확인 문제 */
.tw-h{font-weight:900;margin-bottom:6px}
.chs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.chs button{background:#fff;color:var(--ink);border:2px solid var(--line);font-size:19px;font-weight:700;text-align:left;padding:12px 14px}
.chs button .n{display:inline-block;width:1.6em;color:var(--muted)}
.chs button.sel{border-color:var(--acc);background:var(--acc-soft)}
.chs button.right{border-color:var(--o);background:var(--o-soft)}
.chs button.wrong{border-color:var(--x);background:var(--x-soft)}
.verdict{margin-top:12px;font-weight:900;font-size:20px}
.verdict.r{color:var(--o)}.verdict.w{color:var(--x)}
.exp{margin-top:6px;line-height:1.8}
.subst{margin-top:10px;color:var(--muted);font-weight:700;font-size:15px}
</style>
</head>
<body>
<div class="wrap">

<!-- 첫 화면 -->
<section id="home">
  <div class="box card">
    <h1 id="hTitle">단원 마무리</h1>
    <div class="sub" id="hSub"></div>
    <label class="small">번호와 이름 (예: 7 김민준)</label>
    <input id="myName" type="text" maxlength="10" autocomplete="off" placeholder="번호 이름">
    <label class="small">수업 코드 (선생님 화면의 4자리)</label>
    <input id="classCode" type="text" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="0000">
    <button class="acc" style="width:100%;margin-top:16px;font-size:20px" onclick="joinClick()">수업 들어가기</button>
    <div id="classState"></div>
  </div>
</section>

<!-- 수업 화면 -->
<section id="main" class="hide">
  <div class="top">
    <div class="ttl" id="mTitle"></div>
    <span class="pill" id="who"></span>
    <span class="pill"><span class="dot" id="connDot"></span><span id="connTxt">연결 중</span></span>
  </div>
  <div class="demo-tabs hide" id="demoTabs"></div>
  <div id="view"></div>
</section>
</div>

<div class="overlay" id="pauseOv"><div class="box"><div style="font-size:54px">✋</div><h2 style="margin:6px 0 8px">잠깐 멈춰요</h2><p id="pauseMsg" style="font-size:20px">선생님을 봐 주세요</p></div></div>
<div class="overlay" id="gateOv"><div class="box"><div style="font-size:44px">🔌</div><h2 style="margin:6px 0 8px">선생님 화면과 연결이 끊겼어요</h2><p class="muted" id="gateTxt">다시 연결하는 중이에요. 잠시만 기다려 주세요.</p><button class="ghost" style="margin-top:14px" onclick="goHome()">처음 화면으로</button></div></div>
<div class="toast" id="toast"></div>

<script>
const APP_VER=20261123.1;            // teacher.html 과 같은 값이어야 함 (고칠 때마다 올리기)
const ID_PREFIX='kgg-unitreview-v1-';
const PEER_OPTS={debug:0, config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}]}};
let TURN_ON=false;
const ICE_READY=(async()=>{
  const t=window.NB_TURN||{};
  if(!t.appName||!t.apiKey||!/^[a-z0-9-]+$/i.test(t.appName)) return false;
  try{ const ctl=new AbortController(), tm=setTimeout(()=>ctl.abort(),5000);
    const r=await fetch(`https://${t.appName}.metered.live/api/v1/turn/credentials?apiKey=${encodeURIComponent(t.apiKey)}`,{signal:ctl.signal}); clearTimeout(tm);
    if(!r.ok) return false; const list=await r.json();
    if(Array.isArray(list)&&list.length){ PEER_OPTS.config.iceServers=PEER_OPTS.config.iceServers.concat(list); TURN_ON=true; return true; } }catch(e){}
  return false;
})();

const U=window.UNIT, P=U.problems, TW=U.twins, CAUSE=U.causes;
const PBY=Object.fromEntries(P.map(p=>[p.id,p])), TBY=Object.fromEntries(TW.map(t=>[t.id,t]));
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
function toast(m,ms=2600){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),ms);}
const DEMO=(()=>{try{return new URLSearchParams(location.search).has('demo');}catch(e){return false;}})();
const MK={o:'○',t:'△',x:'×'}, MKW={o:'맞았어요',t:'막혔어요',x:'틀렸어요'};
const PHASES={wait:'대기',diag:'1. 스스로 채점',hint:'2. 힌트 보며 다시 풀기',twin:'3. 확인 문제'};

$('hTitle').textContent=U.title; $('hSub').textContent=U.sub; $('mTitle').textContent=U.title; document.title=U.title;

/* ---------- 상태 ---------- */
let CFG={phase:'wait', showAns:false, wait:60, mode:{}, twinOpen:{}, twinReveal:{}};
let REC=emptyRec();
function emptyRec(){ return {diag:{}, hint:{}, solved:{}, twin:{}}; }
let UI={pid:P[0].id, peek:{}, causeFor:null};
function myName(){ return ($('myName').value.trim()||'이름 없음').slice(0,10); }
function recKey(){ return 'ur-s-'+U.id+'-'+(CL.code||'demo')+'-'+myName(); }
function saveRec(){ LS.set(recKey(),REC); }
function loadRec(){ const r=LS.get(recKey(),null); REC=Object.assign(emptyRec(), r||{}); }
function modeOf(pid){ return CFG.mode[pid]||'hint'; }

if(DEMO){ CFG={phase:'diag', showAns:true, wait:5, mode:Object.fromEntries(P.map(p=>[p.id,'all'])), twinOpen:Object.fromEntries(TW.map(t=>[t.id,true])), twinReveal:{}}; }

/* ---------- 화면 그리기 ---------- */
function probBox(p){
  const f=p.fig? p.fig() : '';
  return `<div class="pbox ${f?'':'nofig'}"><div class="ptext">${p.text}</div>${f?`<div class="figw">${f}</div>`:''}</div>`;
}
function render(){
  if(DEMO) renderDemoTabs();
  const v=$('view'), ph=CFG.phase;
  if(ph==='diag') v.innerHTML=viewDiag();
  else if(ph==='hint') v.innerHTML=viewHint();
  else if(ph==='twin') v.innerHTML=viewTwin();
  else v.innerHTML=`<div class="wait-msg">선생님이 시작하면 화면이 열려요 🙂</div>`;
  tick();
}
function renderDemoTabs(){
  $('demoTabs').classList.remove('hide');
  $('demoTabs').innerHTML='<span class="pill" style="align-self:center">🎬 시연 모드</span>'+['diag','hint','twin'].map(k=>`<button class="${CFG.phase===k?'sel':''}" onclick="CFG.phase='${k}';render()">${PHASES[k]}</button>`).join('');
}
/* 1. 스스로 채점 */
function viewDiag(){
  let h=`<div class="phase-h">${PHASES.diag}</div><div class="phase-d">${CFG.showAns?'정답이 공개됐어요. 내 풀이와 비교해서':'지난 시간에 푼 문제를 떠올리며'} 문제마다 하나를 고르세요. 솔직하게 고를수록 도움이 돼요.</div>`;
  for(const p of P){
    const m=REC.diag[p.id];
    h+=`<div class="card"><div class="drow"><div class="no">${p.no}</div><div class="mid"><div class="ttl2">${p.title}</div>
      ${CFG.showAns?`<div class="ans">정답: ${p.ans}</div>`:''}
      <button class="ghost peek" onclick="UI.peek['${p.id}']=!UI.peek['${p.id}'];render()">${UI.peek[p.id]?'문제 닫기':'문제 보기'}</button>
      ${UI.peek[p.id]?probBox(p):''}</div>
      <div class="marks">${['o','t','x'].map(k=>`<button class="${k} ${m===k?'sel':''}" onclick="setDiag('${p.id}','${k}')"><b>${MK[k]}</b><span>${MKW[k]}</span></button>`).join('')}</div>
    </div></div>`;
  }
  const n=P.filter(p=>REC.diag[p.id]).length;
  h+=`<div class="muted" style="text-align:center">${n} / ${P.length} 문제 골랐어요${n===P.length?' — 다 골랐어요! 선생님을 기다려요.':''}</div>`;
  return h;
}
function setDiag(pid,k){ REC.diag[pid]= REC.diag[pid]===k? undefined : k; if(!REC.diag[pid]) delete REC.diag[pid]; saveRec(); send({t:'diag',pid,v:REC.diag[pid]||null}); render(); }

/* 2. 힌트 */
function hintLv(pid){ return (REC.hint[pid]&&REC.hint[pid].lv)||0; }
function hintT(pid){ return (REC.hint[pid]&&REC.hint[pid].t)||0; }
function waitLeft(pid){ const t=hintT(pid); if(!t) return 0; return Math.max(0, Math.ceil((t+CFG.wait*1000-Date.now())/1000)); }
function viewHint(){
  const p=PBY[UI.pid]||P[0];
  let h=`<div class="phase-h">${PHASES.hint}</div><div class="phase-d">힌트를 하나 열고, <b>종이에 다시 풀어 보세요.</b> 그래도 막히면 다음 힌트를 열어요. 이미 맞힌 문제는 넘어가도 돼요.</div>`;
  h+=`<div class="pgrid">${P.map(q=>{
      const sv=REC.solved[q.id], d=REC.diag[q.id], md=modeOf(q.id);
      const st= sv? '✔ 해결' : md==='lock'? '🔒' : hintLv(q.id)? `힌트 ${hintLv(q.id)}/${q.hints.length}` : (d? MK[d] : '');
      return `<button class="pbtn ${q.id===p.id?'sel':''} ${sv?'solved':''}" onclick="UI.pid='${q.id}';UI.causeFor=null;render()"><b>${q.no}</b><small>${st||'&nbsp;'}</small></button>`;}).join('')}</div>`;
  const md=modeOf(p.id), lv=hintLv(p.id), n=p.hints.length;
  h+=`<div class="card"><div style="display:flex;gap:10px;align-items:center"><span style="font-size:26px;font-weight:900">${p.no}</span>
      ${REC.diag[p.id]?`<span class="mk ${REC.diag[p.id]}">${MK[REC.diag[p.id]]}</span>`:''}<span class="muted">${p.title}</span></div>${probBox(p)}`;
  if(md==='lock'){
    h+=`<div class="lockmsg">🔒 이 문제는 지금 잠겨 있어요. 선생님과 함께 보거나, 힌트 없이 먼저 도전해 봐요!</div>`;
  } else {
    for(let i=0;i<lv && i<n;i++) h+=`<div class="hcard"><div class="hl">힌트 ${i+1} / ${n}</div>${p.hints[i]}</div>`;
    const solShown=REC.hint[p.id]&&REC.hint[p.id].sol;
    if(solShown && md==='all') h+=`<div class="hcard sol"><div class="hl">풀이</div>${p.sol}<div class="rule">💡 ${p.rule}</div></div>`;
    const left=waitLeft(p.id);
    if(lv<n){
      h+=`<div class="next"><button class="acc" id="nextBtn" ${left?'disabled':''} onclick="openHint('${p.id}')">힌트 ${lv+1} 보기</button>
          <span class="cd" id="cd">${left?`종이에 다시 풀어 보세요 · ${left}초 뒤에 열 수 있어요`:''}</span></div>`;
    } else if(!solShown){
      if(md==='all') h+=`<div class="next"><button class="acc" id="nextBtn" ${left?'disabled':''} onclick="openSol('${p.id}')">풀이 보기</button><span class="cd" id="cd">${left?`힌트를 보고 다시 풀어 보세요 · ${left}초 뒤에 열 수 있어요`:''}</span></div>`;
      else h+=`<div class="lockmsg">힌트를 모두 봤어요. 풀이는 선생님이 열어 주시면 볼 수 있어요. 그동안 다시 도전!</div>`;
    }
  }
  // 해결 표시
  const sv=REC.solved[p.id];
  if(sv) h+=`<div class="solvedbar"><span class="done">✔ 해결했어요${sv.cause?` · 처음에 막힌 이유: ${(CAUSE.find(c=>c.k===sv.cause)||{}).short||''}`:''}</span><button class="ghost" style="padding:6px 12px;font-size:14px" onclick="unsolve('${p.id}')">취소</button></div>`;
  else if(UI.causeFor===p.id) h+=`<div style="margin-top:16px;font-weight:900">처음에 왜 막혔나요? (틀렸나요?)</div><div class="causes">${CAUSE.map(c=>`<button onclick="solve('${p.id}','${c.k}')">${c.label}</button>`).join('')}</div>`;
  else h+=`<div class="solvedbar"><button style="background:var(--o)" onclick="solveClick('${p.id}')">✔ 이 문제 해결했어요</button></div>`;
  h+=`</div>`;
  return h;
}
function openHint(pid){
  const p=PBY[pid]; if(modeOf(pid)==='lock'||waitLeft(pid)) return;
  const lv=Math.min(p.hints.length, hintLv(pid)+1);
  REC.hint[pid]=Object.assign({},REC.hint[pid],{lv,t:Date.now()}); saveRec(); send({t:'hint',pid,lv}); render();
}
function openSol(pid){
  if(modeOf(pid)!=='all'||waitLeft(pid)) return;
  REC.hint[pid]=Object.assign({},REC.hint[pid],{sol:true}); saveRec(); send({t:'hint',pid,lv:hintLv(pid),sol:true}); render();
}
function solveClick(pid){ const d=REC.diag[pid]; if(d==='o') solve(pid,null); else { UI.causeFor=pid; render(); } }
function solve(pid,cause){ REC.solved[pid]={lv:hintLv(pid),cause:cause||null,sol:!!(REC.hint[pid]&&REC.hint[pid].sol)}; UI.causeFor=null; saveRec(); send({t:'solved',pid,on:true,cause:cause||null}); render(); toast('잘했어요! 다른 문제도 도전해 봐요'); }
function unsolve(pid){ delete REC.solved[pid]; saveRec(); send({t:'solved',pid,on:false}); render(); }

/* 3. 확인 문제 */
function viewTwin(){
  const open=TW.filter(t=>CFG.twinOpen[t.id]);
  let h=`<div class="phase-h">${PHASES.twin}</div><div class="phase-d">📕 <b>학습지와 풀이를 덮고</b> 혼자 풀어요. 종이에 풀고 답을 고른 뒤 [제출]을 누르세요.</div>`;
  if(!open.length) return h+`<div class="wait-msg">선생님이 확인 문제를 열면 여기에 나타나요</div>`;
  for(const t of open){
    const r=REC.twin[t.id]||{}, rev=!!CFG.twinReveal[t.id], f=t.fig?t.fig():'', of=PBY[t.of];
    const pick=UI['pick_'+t.id]!=null? UI['pick_'+t.id] : r.a;
    h+=`<div class="card"><div class="tw-h">확인 문제 <span class="muted">(${of?of.no:''}번과 쌍둥이)</span></div>
      <div class="pbox ${f?'':'nofig'}"><div class="ptext">${t.text}</div>${f?`<div class="figw">${f}</div>`:''}</div>
      <div class="chs">${t.ch.map((c,i)=>{
        let cls=''; if(rev){ if(i===t.ok) cls='right'; else if(i===r.a) cls='wrong'; } else if(i===pick) cls='sel';
        return `<button class="${cls}" ${rev?'disabled style="opacity:1"':''} onclick="pickTwin('${t.id}',${i})"><span class="n">${'①②③④'[i]}</span>${c}</button>`;}).join('')}</div>`;
    if(!rev){
      const changed= pick!=null && pick!==r.a;
      h+=`<div class="next"><button class="acc" ${pick==null||!changed?'disabled':''} onclick="submitTwin('${t.id}')">${r.a!=null?'답 바꿔서 제출':'제출'}</button>
          <span class="cd">${r.a!=null?`✔ ${'①②③④'[r.a]}번으로 제출했어요. 선생님이 정답을 공개할 때까지 바꿀 수 있어요.`:''}</span></div>`;
    } else {
      if(r.a==null) h+=`<div class="verdict w">제출하지 않았어요</div>`;
      else if(r.a===t.ok) h+=`<div class="verdict r">⭕ 정답이에요!</div>`;
      else h+=`<div class="verdict w">❌ 아쉬워요</div>`;
      h+=`<div class="exp">${t.exp}</div>`;
      if(r.a!=null && r.a!==t.ok){
        if(r.cause) h+=`<div class="subst">놓친 것: ${(CAUSE.find(c=>c.k===r.cause)||{}).short||''}</div>`;
        else h+=`<div style="margin-top:12px;font-weight:900">무엇을 놓쳤나요?</div><div class="causes">${CAUSE.map(c=>`<button onclick="twinCause('${t.id}','${c.k}')">${c.label}</button>`).join('')}</div>`;
      }
    }
    h+=`</div>`;
  }
  return h;
}
function pickTwin(tid,i){ if(CFG.twinReveal[tid]) return; UI['pick_'+tid]=i; render(); }
function submitTwin(tid){
  if(CFG.twinReveal[tid]) return; const a=UI['pick_'+tid]; if(a==null) return;
  REC.twin[tid]=Object.assign({},REC.twin[tid],{a}); saveRec(); send({t:'twinAns',tid,a}); render(); toast('제출했어요');
}
function twinCause(tid,c){ REC.twin[tid]=Object.assign({},REC.twin[tid],{cause:c}); saveRec(); send({t:'twinCause',tid,cause:c}); render(); }

/* 기다리는 시간 표시 (1초마다) */
let tickH=null;
function tick(){
  clearTimeout(tickH);
  if(CFG.phase!=='hint') return;
  const left=waitLeft(UI.pid), btn=$('nextBtn'), cd=$('cd');
  if(btn && cd){
    if(left){ btn.disabled=true; cd.textContent=cd.textContent.replace(/\d+초/, left+'초'); }
    else if(btn.disabled){ render(); return; }
  }
  if(left) tickH=setTimeout(tick,1000);
}

/* ---------- 수업 연결 ---------- */
const CL={peer:null,conn:null,code:null,connected:false};
let deviceId; try{ deviceId=sessionStorage.getItem('ur-tab'); if(!deviceId){ deviceId=Math.random().toString(36).slice(2,12); sessionStorage.setItem('ur-tab',deviceId);} }catch(e){ deviceId=Math.random().toString(36).slice(2,12); }
function setState(t,ok){ const el=$('classState'); el.textContent=t; el.classList.toggle('ok',!!ok); }
function send(o){ if(DEMO) return; try{ CL.conn&&CL.conn.open&&CL.conn.send(o); }catch(e){} }
function hello(){ send({t:'hi',name:myName(),dev:deviceId,ver:APP_VER}); send({t:'sync',rec:REC}); }
function joinClick(){
  const code=$('classCode').value.replace(/\D/g,'');
  if(!$('myName').value.trim()){ setState('먼저 번호와 이름을 입력하세요.'); $('myName').focus(); return; }
  if(code.length!==4){ setState('수업 코드 4자리를 입력하세요.'); return; }
  LS.set('ur-name',$('myName').value.trim()); LS.set('ur-class',code);
  connect(code);
}
function showMain(){ $('home').classList.add('hide'); $('main').classList.remove('hide'); $('who').textContent='👤 '+myName(); render(); }
function goHome(){ disconnect(); $('gateOv').classList.remove('on'); $('pauseOv').classList.remove('on'); $('main').classList.add('hide'); $('home').classList.remove('hide'); setState(''); }
function setConn(on){
  CL.connected=on; $('connDot').classList.toggle('on',on); $('connTxt').textContent=on?'연결됨':'연결 끊김';
  clearTimeout(CL.gateT);
  if(on){ $('gateOv').classList.remove('on'); }
  else if(!$('main').classList.contains('hide')) CL.gateT=setTimeout(()=>{ if(!CL.connected && !$('main').classList.contains('hide')) $('gateOv').classList.add('on'); },3000);
}
function disconnect(){ CL.code=null; clearTimeout(CL.retry); clearInterval(CL.hb); clearInterval(CL.watch); try{CL.conn&&CL.conn.close();}catch(e){} try{CL.peer&&CL.peer.destroy();}catch(e){} CL.peer=null; CL.conn=null; setConn(false); }
function connect(code){ ICE_READY.then(()=>connectNow(code)); }
function connectNow(code){
  if(typeof Peer==='undefined'){ setState('인터넷 연결을 확인하고 새로고침해 주세요.'); return; }
  const same=CL.code===code; clearTimeout(CL.retry); clearInterval(CL.hb); clearInterval(CL.watch);
  try{CL.conn&&CL.conn.close();}catch(e){} try{CL.peer&&CL.peer.destroy();}catch(e){}
  CL.code=code; CL.tries=same?(CL.tries||0)+1:1; loadRec();
  const tryTxt=CL.tries>1?` · ${CL.tries}번째 시도`:'';
  setState('① 연결 서버에 접속하는 중…'+tryTxt); if(!$('main').classList.contains('hide')) $('gateTxt').textContent='다시 연결하는 중…'+tryTxt;
  const p=new Peer(PEER_OPTS); CL.peer=p;
  const retryLater=msg=>{ setState(msg); $('gateTxt').textContent=msg; clearTimeout(CL.retry); CL.retry=setTimeout(()=>{ if(CL.code===code) connect(code); },6000); };
  const D={t0:Date.now(),server:false};
  CL.watch=setInterval(async()=>{
    if(CL.peer!==p||CL.connected){ clearInterval(CL.watch); return; }
    const pc=CL.conn&&CL.conn.peerConnection, sec=Math.round((Date.now()-D.t0)/1000);
    if(D.server) setState((pc&&pc.remoteDescription?'③ 선생님 컴퓨터와 직접 연결하는 중… ':'② 선생님 화면을 찾는 중… ')+sec+'초'+tryTxt);
    if(Date.now()-D.t0<15000) return;
    clearInterval(CL.watch); let msg;
    if(!D.server) msg='❌ ① 연결 서버에 접속하지 못했어요. 패드의 와이파이를 확인하세요.';
    else if(!(pc&&pc.remoteDescription)) msg=`❌ ② 선생님 화면(수업 ${code})이 응답하지 않아요. 코드가 맞는지 확인하세요.`;
    else { let types=new Set(); try{(await pc.getStats()).forEach(r=>{ if(r.type==='local-candidate') types.add(r.candidateType); });}catch(e){}
      msg=`❌ ③ 선생님 컴퓨터와 직접 연결이 안 돼요. 학교 와이파이가 기기끼리 연결을 막는 것 같아요. (바깥 주소 ${types.has('srflx')?'✔':'✖'} · 중계 서버 ${TURN_ON?(types.has('relay')?'✔':'연결 안 됨'):'없음'})`; }
    try{CL.conn&&CL.conn.close();}catch(e){} CL.conn=null; retryLater(msg+' — 잠시 후 다시 시도해요');
  },500);
  p.on('open',()=>{
    D.server=true; setState('② 선생님 화면을 찾는 중…'+tryTxt);
    const c=p.connect(ID_PREFIX+'class-'+code,{reliable:true}); CL.conn=c;
    c.on('open',()=>{
      CL.tries=0; clearInterval(CL.watch); CL.lastPong=Date.now(); setConn(true);
      setState(`✔ 수업 ${code}에 연결됨`,true); hello(); showMain();
      clearInterval(CL.hb); CL.hb=setInterval(()=>{
        if(CL.conn!==c){ clearInterval(CL.hb); return; }
        if(Date.now()-CL.lastPong>12000){ clearInterval(CL.hb); setConn(false); CL.conn=null; try{c.close();}catch(e){} connect(code); return; }
        send({t:'ping'});
      },4000);
    });
    c.on('data',d=>{ if(!d||typeof d!=='object') return; CL.lastPong=Date.now(); onData(d); });
    c.on('close',()=>{ if(CL.conn!==c) return; setConn(false); $('pauseOv').classList.remove('on'); retryLater('선생님 화면과 연결이 끊겼어요. 다시 연결하는 중…'); });
  });
  p.on('error',err=>{
    if(err.type==='peer-unavailable'){ clearInterval(CL.watch); retryLater(`수업 ${code}을(를) 찾지 못했어요. 선생님 화면이 열려 있는지, 코드가 맞는지 확인하세요.`); return; }
    if(!CL.conn||!CL.conn.open) retryLater('연결 오류. 다시 연결하는 중…');
  });
}
function onData(d){
  if(d.t==='cfg'){
    const prev=CFG.phase;
    CFG={phase:d.phase||'wait', showAns:!!d.showAns, wait:Math.max(0,+d.wait||0), mode:d.mode||{}, twinOpen:d.twinOpen||{}, twinReveal:d.twinReveal||{}};
    if(prev!==CFG.phase) window.scrollTo(0,0);
    render();
  } else if(d.t==='mine'){
    // 선생님 장부와 합친 내 기록 (힌트 여는 시각은 내 기기 것을 유지)
    const r=d.rec||{}, old=REC; REC=Object.assign(emptyRec(), r);
    for(const pid in REC.hint){ if(old.hint[pid]&&old.hint[pid].t) REC.hint[pid].t=old.hint[pid].t; }
    saveRec(); render();
  } else if(d.t==='pause'){
    $('pauseOv').classList.toggle('on',!!d.on); if(d.msg) $('pauseMsg').textContent=d.msg;
  } else if(d.t==='ver'){
    const v=+d.v||0; if(v&&v!==APP_VER){ const m=v>APP_VER?'⚠ 새 버전이 있어요. 이 화면을 새로고침해 주세요.':'⚠ 선생님 화면이 옛 버전이에요. 선생님께 새로고침을 부탁하세요.'; toast(m,6000); setState(m); }
  } else if(d.t==='home'){ goHome(); }
}

/* ---------- 시작 ---------- */
(function init(){
  const n=LS.get('ur-name',''); if(n) $('myName').value=n;
  if(DEMO){ $('myName').value=$('myName').value||'시연'; loadRec(); $('connTxt').textContent='시연 (연결 없음)'; showMain(); return; }
  let code=null; try{ const q=new URLSearchParams(location.search).get('c'); if(q&&/^\d{4}$/.test(q)) code=q; }catch(e){}
  if(!code) code=LS.get('ur-class',null);
  if(code){ $('classCode').value=code; if(n) setTimeout(()=>connect(code),300); else setState('번호와 이름을 입력하고 [수업 들어가기]를 누르세요.'); }
})();
$('myName').addEventListener('change',()=>{ LS.set('ur-name',$('myName').value.trim()); });
</script>
