<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단원 마무리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="units/list.js"></script>
<script src="points.js"></script>
<style>
.wrap{max-width:1100px;margin:0 auto;padding:14px 16px 60px}
/* 첫 화면 */
#home .box{max-width:460px;margin:40px auto 0}
h1{font-size:30px;font-weight:900;text-align:center;margin-bottom:2px}
.sub{text-align:center;color:var(--muted);margin-bottom:22px}
label.small{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
#home input{width:100%;font-size:20px}
#classCode{font-size:34px!important;text-align:center;letter-spacing:12px;font-weight:900}
#classState{margin-top:14px;font-size:15px;color:var(--muted);line-height:1.5;min-height:1.5em}
#classState.ok{color:var(--o);font-weight:700}
/* 상단 */
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.top .ttl{font-weight:900;font-size:19px;flex:1;min-width:160px}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.pill .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#bbb;margin-right:6px}
.pill .dot.on{background:var(--o)}
.nav{display:flex;gap:8px;margin-bottom:14px}
.nav button{flex:1;background:#fff;color:var(--ink);border:2px solid var(--line);font-size:18px;padding:12px}
.nav button.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.nav button.bas.sel{background:#7a4fb5;border-color:#7a4fb5}
.nav button.game{flex:0 0 auto;padding:12px 16px}.nav button.game.sel{background:#e0962b;border-color:#e0962b}.nav button.game.has{border-color:#e0962b}
.ptfly{position:fixed;right:18px;top:70px;z-index:60;background:#e0962b;color:#fff;font-weight:900;font-size:20px;padding:8px 14px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.18);animation:ptfly 1.8s ease-out forwards;pointer-events:none}
@keyframes ptfly{0%{opacity:0;transform:translateY(10px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
.gm{display:grid;gap:14px}.gm .tk{font-size:17px;font-weight:700}
.gmodes{display:flex;gap:8px;flex-wrap:wrap}.gmodes button{flex:1;min-width:150px;background:#fff;color:var(--ink);border:2px solid var(--line)}.gmodes button.sel{background:#e0962b;color:#fff;border-color:#e0962b}
.gpick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.gpick button{min-width:64px;font-size:22px;background:#fff;color:var(--ink);border:2px solid var(--line)}.gpick button.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.die{width:110px;height:110px;margin:6px auto;border-radius:22px;background:#fff;border:3px solid var(--ink);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14px;box-shadow:0 6px 0 #d8d2c6}
.die i{width:20px;height:20px;border-radius:50%;background:var(--ink);place-self:center;visibility:hidden}.die i.on{visibility:visible}
.die.roll{animation:dieroll .12s linear infinite}@keyframes dieroll{0%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}100%{transform:rotate(-12deg)}}
.stk{display:flex;flex-wrap:wrap;gap:6px}.stk span{font-size:30px;background:#fff7e8;border:2px solid #f0d9ae;border-radius:12px;padding:2px 6px}.stk span small{font-size:13px;font-weight:900;color:#a0661a}
.freq{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;height:110px}.freq div{background:#f0d9ae;border-radius:6px 6px 0 0;text-align:center;font-size:13px;font-weight:700;position:relative}.freq div b{position:absolute;bottom:-22px;left:0;right:0}
.bbboard{background:#1f4a35;color:#f4f1e6;border-radius:18px;padding:16px;box-shadow:inset 0 0 0 4px #2e6249}
.bbboard .muted{color:#c9d8cc}.bbboard .verdict.r{color:#ffd95a}.bbboard .verdict.w{color:#ffb3b3}
.bbboard button{color:var(--ink)}.bbboard button.acc{color:#fff}
.bbrule{line-height:1.8;margin-bottom:8px}.bbin{width:110px;font-size:20px;padding:8px;border-radius:10px;border:2px solid #2e6249;text-align:center}
.bbroom{display:flex;justify-content:space-between;align-items:center;background:#173b2a;border-radius:10px;padding:8px 12px;margin-top:6px}
.bbcode{font-size:56px;font-weight:900;letter-spacing:8px;color:#ffd95a}
.bbvs{font-weight:900;font-size:18px;margin-bottom:10px}.bbvs span{color:#ffd95a;margin:0 6px}
.bbt{display:inline-flex;gap:4px;vertical-align:middle}.bbt i{position:relative;font-style:normal;width:40px;height:46px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;background:#0b1f14;border:2px solid #4f7a63;color:#f4f1e6}
.bbt i.O{background:#ffd95a;border-color:#ffd95a;color:#1f4a35}.bbt i.A{background:#4a8fe7;border-color:#4a8fe7;color:#fff}.bbt i.X{background:#26332c;border-color:#26332c;color:#7f8f86}.bbt i.w{border-style:dashed}
.bbt i s{position:absolute;top:0;right:3px;font-size:12px;text-decoration:none}
.bbkeys{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.bbkeys button{font-size:24px;padding:10px 0;background:#fff}
.bbtab{width:100%;border-collapse:collapse}.bbtab th{font-size:14px;color:#c9d8cc;text-align:left;padding:4px}.bbtab td{padding:4px;border-top:1px solid #2e6249}.bbtab td.k{color:#c9d8cc;width:44px}
.bbcand{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;max-width:420px}.bbcand b{text-align:center;color:#c9d8cc}
.bbcand button{padding:6px 0;font-size:17px;background:#0b1f14;color:#f4f1e6;border:2px solid #4f7a63}.bbcand button.x{color:#4f5d55;text-decoration:line-through;background:#18241e;border-color:#18241e}
.bbcand i.no{background:repeating-linear-gradient(45deg,#173b2a 0 4px,#24533c 4px 8px);border-radius:6px}
.bbdet{margin-top:12px}.bbdet summary{cursor:pointer;font-weight:900}.bbset{font-size:20px;font-weight:900;color:#ffd95a;margin-top:8px}
.ptab{width:100%;border-collapse:collapse;font-size:15px}.ptab td{padding:5px 6px;border-bottom:1px solid var(--line)}.ptab td.r{text-align:right;white-space:nowrap;font-weight:700}
.phase-h{font-size:23px;font-weight:900;margin:2px 0 4px}
.phase-d{color:var(--muted);margin-bottom:14px}
/* 문제 목록 */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pcard{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;text-align:left;color:var(--ink);display:flex;gap:12px;align-items:center;font-weight:400}
.pcard .no{font-size:34px;font-weight:900;line-height:1}
.pcard .tt{font-weight:700;font-size:16px}
.pcard .st{font-size:14px;color:var(--muted);font-weight:700;margin-top:2px}
.pcard.done{border-color:var(--o);background:#f6fbf8}
.pcard.done .st{color:var(--o)}
.pcard.miss .st{color:var(--x)}
.prog{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px}
.prog .pl{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.prog .pb{height:12px;border-radius:99px;background:#ece7dc;overflow:hidden}
.prog .pb div{height:100%;background:var(--o);border-radius:99px;transition:width .4s}
.cheer{background:var(--o-soft);border:2px solid var(--o);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-weight:700}
.pcard.nx{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.pcard .nxb{font-size:13px;font-weight:900;color:var(--acc);margin-top:2px}
.refl{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;line-height:1.7}
.refl .rh{font-weight:900;font-size:18px;margin-bottom:4px}
.refl .rt{background:var(--acc-soft);border-radius:10px;padding:8px 12px;margin:6px 0;font-weight:700}
.refl .mini{margin:2px 4px 2px 0}
.bascall{margin-top:16px;background:#f4eefb;border:2px dashed #b89ad8;border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bascall b{font-size:18px}
.bascall button{background:#7a4fb5}
/* 문제 화면 */
.phead{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.phead .no{font-size:30px;font-weight:900}
.phead .tt{color:var(--muted);font-weight:700;flex:1}
.flow{display:flex;gap:6px;margin:6px 0 4px;flex-wrap:wrap}
.flow span{font-size:14px;font-weight:700;padding:4px 10px;border-radius:999px;background:#efece5;color:var(--muted)}
.flow span.cur{background:var(--acc);color:#fff}
.flow span.ok{background:var(--o-soft);color:var(--o)}
.pbox{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start;margin-top:10px}
.pbox.nofig{grid-template-columns:1fr}
@media (max-width:700px){ .pbox{grid-template-columns:1fr} .pbox .figw{max-width:330px;margin:0 auto;width:100%} }
.sec{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.sec-h{font-weight:900;font-size:17px;margin-bottom:8px}
.ansline{font-weight:700;color:var(--acc);font-size:19px;margin:6px 0 10px}
.marks{display:flex;gap:8px}
.marks button{flex:1;padding:10px 4px;background:#fff;color:var(--ink);border:2px solid var(--line);line-height:1.2}
.marks button b{display:block;font-size:28px}
.marks button span{font-size:14px;font-weight:700}
.marks button.o:hover,.marks button.o:active{border-color:var(--o)}
.mini{font-size:14px;padding:5px 10px}
.hcard{border-left:6px solid var(--acc);background:var(--acc-soft);border-radius:12px;padding:12px 14px;margin-top:10px}
.hcard .hl{font-size:13px;font-weight:900;color:var(--acc);margin-bottom:2px}
.hcard.sol{border-color:var(--o);background:var(--o-soft)}
.hcard.sol .hl{color:var(--o)}
.hchk{margin-top:10px;padding-top:10px;border-top:1px dashed #c9b8e6;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.hchk label{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:15px}
.hchk input{width:92px;font-size:18px;padding:6px 8px;border:2px solid #c9b8e6;border-radius:10px;text-align:center}
.hchk input.bad{border-color:var(--x);background:var(--x-soft)}
.hchk input.good{border-color:var(--o);background:var(--o-soft)}
.hchk button{padding:8px 16px}
.hchk .hm{flex-basis:100%;font-size:14px;color:#7a5a00}
.hdone{margin-top:8px;font-size:14px;font-weight:700;color:var(--o)}
.stg{font-size:13px;font-weight:800;padding:4px 10px;border-radius:999px;background:#eee;margin-left:6px}
.stg.learn{background:#fff1cc}.stg.practice{background:#dff0ff}.stg.free{background:#e2f5e6}
.errpick{margin-top:10px;padding:12px 14px;border-radius:12px;background:#fff6e6;border:2px solid #f0d49a}
.cover{margin-top:12px;padding:14px;border-radius:12px;background:#f3f0ea;border:2px dashed #cdbfa6}
.over{margin-top:10px;padding:10px 12px;border-radius:10px;background:#fff1f0;border:2px solid #f2c0ba;font-weight:600}
.rulebox{margin-top:12px;padding:12px 14px;border-radius:12px;background:#fffbe6;border:2px solid #f1df8f}
.rulebox.ok{background:var(--o-soft);border-color:#9fd3b0}
.rule{margin-top:10px;padding-top:8px;border-top:1px dashed #9cc8ad;font-weight:900}
.next{margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.next .cd{color:var(--muted);font-weight:700}
.lockmsg{margin-top:12px;padding:12px 14px;border-radius:12px;background:#f1efe9;color:var(--muted);font-weight:700}
.done{color:var(--o);font-weight:900}
.causes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.causes button{background:#fff;color:var(--ink);border:2px solid var(--line)}
.suggest{margin-top:14px;background:#f4eefb;border-radius:14px;padding:12px 14px}
.suggest .b{font-weight:900;margin-bottom:8px}
.suggest button{background:#7a4fb5;margin:0 6px 6px 0;font-size:15px;padding:9px 12px}
.chs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.chs button{background:#fff;color:var(--ink);border:2px solid var(--line);font-size:19px;font-weight:700;text-align:left;padding:12px 14px}
.chs button .n{display:inline-block;width:1.6em;color:var(--muted)}
.chs button.sel{border-color:var(--acc);background:var(--acc-soft)}
.chs button.right{border-color:var(--o);background:var(--o-soft)}
.chs button.wrong{border-color:var(--x);background:var(--x-soft)}
.chs.wide{grid-template-columns:repeat(4,1fr)}
.chs.wide button{text-align:center;font-size:17px;padding:12px 6px}
@media (max-width:700px){ .chs.wide{grid-template-columns:repeat(2,1fr)} }
.verdict{margin-top:12px;font-weight:900;font-size:20px}
.verdict.r{color:var(--o)}.verdict.w{color:var(--x)}
.exp{margin-top:6px;line-height:1.8}
.twbox{border:2px solid var(--acc);border-radius:14px;padding:14px;margin-top:8px;background:#fbfcff}
/* 기초 연습 */
.btypes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.btype{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;text-align:left;color:var(--ink);font-weight:400}
.btype.rec{border-color:#7a4fb5;background:#faf6ff}
.btype b{font-size:18px;display:block}
.btype .d{color:var(--muted);font-size:14px}
.btype .s{margin-top:6px;font-size:14px;font-weight:700}
.stars{color:#e0a100;font-size:18px}
.streak{display:flex;gap:6px;align-items:center;font-weight:700;color:var(--muted)}
.streak i{width:16px;height:16px;border-radius:50%;background:#e6e1d6;display:inline-block}
.streak i.on{background:var(--o)}
.sent{margin-top:12px;font-size:21px;line-height:2;font-weight:700}
.blank{display:inline-block;min-width:4em;border-bottom:3px solid var(--ink);margin:0 4px}
.numin{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.numin input{width:140px;font-size:24px;font-weight:900;text-align:center}
.numin .sfx{font-family:"Times New Roman",Times,serif;font-size:24px}
.steps .st{margin-top:12px;padding:12px 14px;border-radius:12px;background:#f7f4ee}
.steps .st.ok{background:var(--o-soft)}
.steps .st.rev{background:var(--t-soft)}
.steps .q{font-weight:700}
.steps .chs{margin-top:8px}
.ptext .tk{border-radius:5px;padding:1px 0;transition:background .15s}
.ptext.marking .tk{cursor:pointer}
.ptext.marking .tk:not(.hw):not(.hk){background:linear-gradient(transparent 82%,#e6dccb 82%)}
.ptext .tk.hw{background:#ffcdc7;box-shadow:0 0 0 2px #ffcdc7}
.ptext .tk.hk{background:#cfe2ff;box-shadow:0 0 0 2px #cfe2ff}
.pens{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pens button{padding:8px 14px;border-radius:999px;border:2px solid #ddd;background:#fff;color:#2d2a26;font-weight:800}
.pens button.w.on{border-color:#e06a5a;background:#ffcdc7}
.pens button.k.on{border-color:#4f86d6;background:#cfe2ff}
.memo{margin-top:10px;border:2px dashed #d8cfbf;border-radius:12px;padding:10px 12px;background:#fffdf8}
.memo .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0}
.memo .lb{font-weight:900;min-width:96px}
.memo .chip{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 8px;border-radius:10px;background:#f4f1ea}
.memo .chip.w{background:#ffe4e0}.memo .chip.k{background:#e3eeff}
.memo .chip .tx{font-weight:800}
.memo .nm button{padding:4px 9px;margin:2px;border-radius:8px;border:1.5px solid #ccc;background:#fff;color:#2d2a26;font-size:14px;font-weight:700}
.memo .nm button.on{background:#2d2a26;color:#fff;border-color:#2d2a26}
.memo .muted{font-size:14px}
.msg{margin-top:8px;font-weight:700}
.msg.w{color:var(--x)}.msg.r{color:var(--o)}
</style>
</head>
<body>
<div class="wrap">

<section id="home">
  <div class="box card">
    <h1 id="hTitle">단원 마무리</h1>
    <div class="sub" id="hSub"></div>
    <label class="small">번호와 이름 (예: 7 김민준)</label>
    <input id="myName" type="text" maxlength="16" autocomplete="off" placeholder="번호 이름">
    <label class="small">수업 코드 (선생님 화면의 4자리)</label>
    <input id="classCode" type="text" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="0000">
    <button class="acc" style="width:100%;margin-top:16px;font-size:20px" onclick="joinClick()">수업 들어가기</button>
    <div id="classState"></div>
  </div>
</section>

<section id="main" class="hide">
  <div class="top">
    <div class="ttl" id="mTitle"></div>
    <span class="pill" id="who"></span>
    <span class="pill"><span class="dot" id="connDot"></span><span id="connTxt">연결 중</span></span>
  </div>
  <div class="nav">
    <button id="navList" onclick="go('list')">📋 문제 목록</button>
    <button id="navBas" class="bas" onclick="go('bas')">🧱 기초 연습</button>
    <button id="navPts" class="game" onclick="go('pts')">⭐ <b id="ptN">0</b>점</button>
    <button id="navGame" class="game hide" onclick="go('game')">🎲 주사위</button>
    <button id="navBB" class="game hide" onclick="go('bb')">⚾ 숫자야구</button>
  </div>
  <div id="view"></div>
</section>
</div>

<div class="overlay" id="pauseOv"><div class="box"><div style="font-size:54px">✋</div><h2 style="margin:6px 0 8px">잠깐 멈춰요</h2><p id="pauseMsg" style="font-size:20px">선생님을 봐 주세요</p></div></div>

<div class="overlay" id="askOv"><div class="box"><div style="font-size:40px">📕</div><h2 style="margin:6px 0 8px">확인 문제를 풀까요?</h2><p style="font-size:17px;line-height:1.7">학습지와 풀이를 덮고 <b>혼자</b> 풀어요.<br>답을 낼 때까지 이 문제의 <b>힌트·풀이가 닫히고</b>,<br>제출은 <b>한 번</b>만 할 수 있어요.</p>
  <div style="display:flex;gap:10px;margin-top:16px"><button class="ghost" style="flex:1" onclick="$('askOv').classList.remove('on')">아직이요</button><button class="acc" style="flex:1" id="askGo">풀게요</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
const APP_VER=20261125.7;            // teacher.html 과 같은 값이어야 함 (고칠 때마다 올리기)
if(!window.UNIT||!window.ULIB){ document.body.insertAdjacentHTML('afterbegin','<div style="background:#fbe5e8;color:#cf3f54;padding:16px;font-weight:700;text-align:center">⚠ 단원 파일을 읽지 못했어요. 화면을 새로고침해 보고, 그래도 안 되면 선생님께 알려 주세요.</div>'); throw new Error('unit file not loaded'); }
const U=window.UNIT, P=U.problems, TW=U.twins, CAUSE=U.causes, BT=U.basicTypes, BG=U.basicGen;
/* 막힌 이유: 문제마다 따로(p.causes) + '잘 모르겠어요'. 없으면 단원 공통 CAUSES */
const CBY=Object.fromEntries(CAUSE.concat(...P.map(p=>p.causes||[])).map(c=>[c.k,c]));
function causesOf(pid){ const p=P.find(x=>x.id===pid); return p&&p.causes&&p.causes.length? p.causes.concat(CAUSE.filter(c=>c.k==='unsure')) : CAUSE; }
function causeCat(k){ const c=CBY[k]; return c&&c.cat? c.cat : k; }
const TBY=Object.fromEntries(TW.map(t=>[t.id,t])), PBY=Object.fromEntries(P.map(p=>[p.id,p])), TOF=Object.fromEntries(TW.map(t=>[t.of,t])), BBY=Object.fromEntries(BT.map(b=>[b.k,b]));
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
function toast(m,ms=2600){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),ms);}
const DEMO=(()=>{try{return new URLSearchParams(location.search).has('demo');}catch(e){return false;}})();
const MIRROR=DEMO&&(()=>{try{return new URLSearchParams(location.search).has('mirror')&&window.parent!==window;}catch(e){return false;}})();   // 교사 화면 안의 '학생 화면'
const MK={o:'○',t:'△',x:'×'}, MKW={o:'맞았어요',t:'막혔어요',x:'틀렸어요'}, NUM='①②③④';
if(!BT.length) $('navBas').classList.add('hide');   // 기초 연습이 없는 단원
$('hTitle').textContent=U.title; $('hSub').textContent=U.sub; $('mTitle').textContent=U.title; document.title=U.title;

/* ---------- 상태 ---------- */
let CFG={wait:30, mode:{}, lesson:'review', mix:0, game:0, bb:0, bbMax:10};
if(DEMO) CFG.wait=5;
function emptyRec(){ return {diag:{}, seen:{}, hint:{}, solved:{}, twin:{}, bas:{}, err:{}, rule:{}, game:{used:0,st:{},rolls:[],hit:{}}}; }
let REC=emptyRec();
let UI={view:'list', pid:null, causeFor:null, showHints:{}, twinPick:{}, bt:null, BS:null, cover:{}, MX:null, gmode:'oe', gpick:null, rolling:false, last:null, pts:null};
/* 이름 정리: 띄어쓰기·'번'·앞자리 0을 통일 → '7 김민준' (같은 학생이 다르게 써서 기록이 나뉘지 않게) */
function normName(s){ s=String(s||'').replace(/\s+/g,''); const m=s.match(/^0*(\d+)번?[.,·:)\-_]*(.+)$/); if(m) s=(+m[1])+' '+m[2]; return s.slice(0,12); }
function nameOk(s){ return /^\d{1,2} [^\d\s][^\s]{0,9}$/.test(s); }
function myName(){ return normName($('myName').value)||'이름 없음'; }
function recKey(){ return 'ur-s-'+U.id+'-'+(DEMO?'demo':(CL.code||''))+'-'+myName(); }
function saveRec(){ if(MIRROR) return; LS.set(recKey(),REC); }
function loadRec(){ const r=LS.get(recKey(),null); REC=Object.assign(emptyRec(), r||{}); }
function modeOf(pid){ return CFG.mode[pid]||'all'; }   // lock: 힌트 잠금 · hint: 풀이 막기 · all: 힌트 다 보면 풀이도 열림

/* 문제 상태 */
function stOf(p){
  const d=REC.diag[p.id], tw=TOF[p.id], tr=(tw&&REC.twin[tw.id])||{}, sv=REC.solved[p.id];
  return {d, tw, tr, sv, lv:hintLv(p.id), n:p.hints.length,
    canTwin: !!tw && (d==='o'||!!sv), twinPending: !!(tr.open && tr.a==null), twinDone: tr.a!=null, twinOk: tw && tr.a===tw.ok};
}
function hintLv(pid){ return (REC.hint[pid]&&REC.hint[pid].lv)||0; }
function waitLeft(pid){ const t=REC.hint[pid]&&REC.hint[pid].t; if(!t) return 0; return Math.max(0, Math.ceil((t+CFG.wait*1000-Date.now())/1000)); }

/* ---------- 화면 이동 ---------- */

}

  const v=$('view');

  const inp=v.querySelector('input.ans'); if(inp){ inp.focus({preventScroll:true}); inp.addEventListener('keydown',e=>{ if(e.key==='Enter') basSubmitNum(); }); }

}
function locText(){
  if(UI.view==='prob'){ const p=PBY[UI.pid], s=stOf(p);
    if(s.twinPending) return p.no+' 확인 문제';
    if(!s.d) return p.no+' 채점';
    if(s.twinDone) return p.no+' 확인 '+(s.twinOk?'⭕':'❌');
    if(s.d!=='o'&&!s.sv) return p.no+(s.lv?` 힌트 ${s.lv}/${s.n}`:' 다시 풀기');
    return p.no+' 해결';
  }
  if(UI.view==='bt') return '기초 '+UI.bt;
  if(UI.view==='mix') return '섞어 풀기';
  if(UI.view==='game') return '🎲 주사위';
  if(UI.view==='pts') return '⭐ 포인트';
  if(UI.view==='bb') return '⚾ 숫자야구';
  if(UI.view==='bas') return '기초 연습 고르는 중';
  return '문제 목록';
}
let lastLoc='';
function reportLoc(){ const l=locText(); if(l!==lastLoc){ lastLoc=l; send({t:'loc',v:l}); } }

/* ---------- 문제 목록 ---------- */
function statusText(p){
  const s=stOf(p);
  if(s.twinDone) return s.twinOk? ['✔ 확인 문제 ⭕','done'] : ['확인 문제 ❌ · 다시 보기','miss'];
  if(s.twinPending) return ['확인 문제 푸는 중',''];
  if(!s.d) return ['채점 전',''];
  if(s.d==='o' || s.sv) return s.tw? [(s.sv?'✔ 해결':'○ 맞음')+' · 확인 문제 남음',''] : [(s.sv?'✔ 해결':'✔ 맞음'),'done'];
  return [`${MK[s.d]} · ${s.lv?`힌트 ${s.lv}/${s.n}`:'다시 풀기'}`,''];
}
/* 완성: 확인 문제를 맞힘 (확인 문제가 없으면 해결) */
function isDone(p){ const s=stOf(p); return s.tw? !!s.twinOk : (s.d==='o'||!!s.sv); }
/* 다음에 하면 좋을 문제: 푸는 중인 확인 문제 → 다시 풀던 문제 → 확인 문제만 남은 문제 → 아직 안 본 문제 */
function nextProb(){
  const st=P.map(p=>[p,stOf(p)]);
  const f=fn=>{ const x=st.find(([p,s])=>fn(p,s)); return x&&x[0]; };
  return f((p,s)=>s.twinPending) || f((p,s)=>s.d&&s.d!=='o'&&!s.sv) || f((p,s)=>s.canTwin&&!s.tr.open) || f((p,s)=>!s.d) || null;
}
function viewList(){
  const done=P.filter(isDone).length, nx=nextProb(), pct=Math.round(done/P.length*100);
  let h=`<div class="phase-h">문제 목록</div><div class="phase-d">풀고 싶은 문제를 골라요. 문제마다 <b>${CFG.lesson==='first'?'① 도전':'① 채점'} → ② 다시 풀기${TW.length?' → ③ 확인 문제':''}</b> 순서로 진행해요.</div>`;
  if(CFG.mix && !(REC.mix&&REC.mix.at===CFG.mix&&REC.mix.done)) h+=`<div class="cheer" style="background:#efe7fb;border-color:#b89ad8">🔀 <b>섞어 풀기</b>가 열렸어요! 오늘 배운 생각을 섞어서 4문제 풀어요. <button class="acc" style="margin-left:8px" onclick="go('mix')">${REC.mix&&REC.mix.at===CFG.mix?'이어서 풀기':'시작하기'}</button></div>`;
  if(CFG.lesson==='first') h+=`<div class="cheer" style="background:#eef5ff;border-color:#9cc0ef">🆕 <b>처음 배우는 문제들이에요.</b> 문제마다 종이에 <b>🎯 구할 것 · 📌 아는 것</b>부터 적고 풀어 보세요. 개념이 낯설면 ${BT.length?'<b>🧱 기초 연습</b>으로 먼저 몸풀기를 해도 좋아요.':'선생님께 물어보세요.'}</div>`;
  h+=`<div class="prog"><div class="pl"><b>완성 ${done} / ${P.length}</b><span class="muted">${TW.length?'확인 문제까지 맞히면 완성이에요':'해결하면 완성이에요'}</span></div><div class="pb"><div style="width:${pct}%"></div></div></div>`;
  if(done===P.length) h+=`<div class="cheer">🎉 모든 문제를 완성했어요! 아래 <b>나의 돌아보기</b>를 읽고, 시간이 남으면 ${BT.length?'기초 연습에서 ⭐를 모아 보거나 ':''}친구를 도와주세요.</div>`;
  h+=`<div class="plist">`;
  for(const p of P){ const [t,c]=statusText(p), isNx=nx&&nx.id===p.id;
    h+=`<button class="pcard ${c} ${isNx?'nx':''}" onclick="go('prob','${p.id}')"><span class="no">${p.no}</span><span><div class="tt">${p.title}</div><div class="st">${t}</div>${isNx?'<div class="nxb">👉 다음에 해 볼 문제</div>':''}</span></button>`; }
  h+=`</div>`;
  h+=reflectHTML();
  if(!BT.length) return h;
  h+=`<div class="bascall"><span style="font-size:34px">🧱</span><span style="flex:1"><b>도저히 못 풀겠다면?</b><br><span class="muted">기초 유형부터 차근차근 연습해요. 언제든 문제 목록으로 돌아올 수 있어요.</span></span><button onclick="go('bas')">기초 연습 하러 가기</button></div>`;
  return h;
}

/* 나의 돌아보기: 스스로 고른 '막힌 이유'와 확인 문제 결과를 모아 보여 줌 */
function reflectHTML(){
  const cnt={}, mine=[], add=k=>{ if(!k) return; mine.push(k); k=causeCat(k); cnt[k]=(cnt[k]||0)+1; };
  for(const p of P){ const sv=REC.solved[p.id]; if(sv) add(sv.cause); }
  for(const t of TW){ const x=REC.twin[t.id]; if(x&&x.a!=null&&x.a!==t.ok) add(x.cause); }
  const marked=P.filter(p=>REC.diag[p.id]).length; if(!marked) return '';
  const first=P.filter(p=>REC.diag[p.id]==='o').length, fixed=P.filter(p=>REC.solved[p.id]).length;
  const wrong=TW.filter(t=>{ const x=REC.twin[t.id]; return x&&x.a!=null&&x.a!==t.ok; });
  const stars=BT.filter(b=>REC.bas[b.k]&&REC.bas[b.k].star);
  const tips={concept:'개념이 헷갈렸어요 → 🧱 개념 빈칸, 그림 보고 이름 고르기로 뜻부터 다져요.', idea:'아이디어가 안 떠올랐어요 → 풀이 아래 💡 한 줄 규칙을 공책에 옮겨 적어 두세요.', calc:'계산 실수가 있었어요 → 답을 내기 전에 한 번 더 계산해 보는 습관을 들여요.', unsure:'왜 막혔는지 잘 모르겠다면 → 선생님께 그 문제를 같이 봐 달라고 해요.'};
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
  let h=`<div class="refl"><div class="rh">🪞 나의 돌아보기</div><div class="rl">처음부터 맞힌 문제 <b>${first}</b>개 · 다시 풀어 해결한 문제 <b>${fixed}</b>개${TW.length?` · 확인 문제 ⭕ <b>${TW.filter(t=>{const x=REC.twin[t.id]; return x&&x.a===t.ok;}).length}</b>개`:''}${stars.length?` · 기초 ⭐ <b>${stars.length}</b>개`:''}</div>`;
  if(top.length) h+=`<div class="rl">내가 고른 막힌 이유: ${top.map(([k,v])=>`${(CAUSE.find(c=>c.k===k)||{}).short||k} <b>${v}</b>`).join(' · ')}</div><div class="rt">${tips[top[0][0]]||''}</div>`;
  const spec=[...new Set(mine)].filter(k=>CBY[k]&&CBY[k].cat).map(k=>CBY[k].short); if(spec.length) h+=`<div class="rl">자세히: ${spec.join(' · ')}</div>`;
  const over=TW.filter(t=>{ const x=REC.twin[t.id]; return x&&x.a!=null&&x.a!==t.ok&&REC.diag[t.of]==='o'; });
  if(over.length) h+=`<div class="rl">🤔 ○로 채점했지만 확인 문제가 달랐던 문제 <b>${over.length}</b>개: ${over.map(t=>PBY[t.of].no).join(' ')} · 채점할 때 '왜 맞았는지' 설명할 수 있는지 따져 봐요.</div>`;
  const rk=Object.keys(REC.rule||{}).filter(k=>PBY[k]); if(rk.length) h+=`<div class="rl">💡 핵심 생각 찾기 <b>${rk.filter(k=>REC.rule[k].ok).length}</b> / ${rk.length}</div>`;
  if(wrong.length) h+=`<div class="rl">확인 문제를 틀린 문제 ${wrong.map(t=>`<button class="ghost mini" onclick="go('prob','${t.of}')">${PBY[t.of].no} 다시 보기</button>`).join(' ')}</div>`;
  return h+`</div>`;
}
/* ---------- 문제 하나 ---------- */
function probBox(p){ const f=p.fig?p.fig():''; return `<div class="pbox ${f?'':'nofig'}"><div class="ptext">${p.text}</div>${f?`<div class="figw">${f}</div>`:''}</div>`; }
function viewProb(p){
  const s=stOf(p);
  const step= s.twinPending||s.twinDone ? 3 : (!s.d ? 1 : (s.canTwin ? 3 : 2));
  let h=`<div class="phead"><span class="no">${p.no}</span><span class="tt">${p.title}</span><button class="ghost mini" onclick="go('list')">← 목록</button></div>
    <div class="flow">${[CFG.lesson==='first'?'① 도전':'① 채점','② 다시 풀기','③ 확인 문제'].slice(0,s.tw?3:2).map((x,i)=>`<span class="${i+1===step?'cur':(i+1<step?'ok':'')}">${x}</span>`).join('')}</div>`;
  if(s.twinPending){
    return h+`<div class="card">${twinBlock(p,s)}<div class="lockmsg" style="margin-top:14px">📕 확인 문제를 내면 이 문제의 힌트·풀이가 다시 열려요.</div></div>`;
  }
  h+=`<div class="card">${probBox(p)}`;
  /* ① 채점 */
  const first=CFG.lesson==='first';
  h+=`<div class="sec"><div class="sec-h">${first?'① 도전':'① 채점'}</div>`;
  if(!s.d){
    if(!REC.seen[p.id]) h+= first? `<div class="muted" style="margin-bottom:8px">처음 풀어 보는 문제예요. 종이에 <b>🎯 구할 것 · 📌 아는 것</b>부터 적고 끝까지 풀어 보세요.</div>
        <div class="btns"><button class="acc" onclick="seeAns('${p.id}')">다 풀었어요 → 정답 확인</button> <button class="ghost" onclick="stuckFirst('${p.id}')">막혔어요 → 힌트로</button></div>`
      : `<div class="muted" style="margin-bottom:8px">지난 시간에 푼 답을 떠올리고 정답을 확인해요.</div><button class="acc" onclick="seeAns('${p.id}')">정답 확인</button>`;
    else h+=`<div class="ansline">정답: ${p.ans}</div><div class="muted" style="margin-bottom:8px">내 답과 비교해서 하나를 골라요. 솔직하게!</div>
      <div class="marks">${['o','t','x'].map(k=>`<button class="${k}" onclick="setDiag('${p.id}','${k}')"><b>${MK[k]}</b><span>${MKW[k]}</span></button>`).join('')}</div>`;
  } else {
    h+=`<span class="mk ${s.d}">${MK[s.d]}</span> <b>${MKW[s.d]}</b> <span class="muted">· 정답 ${p.ans}</span>
      ${!s.lv&&!s.sv&&!(s.tr.open)?` <button class="ghost mini" onclick="setDiag('${p.id}',null)">다시 고르기</button>`:''}`;
  }
  h+=`</div>`;
  /* ② 다시 풀기 */
  if(s.d){
    h+=`<div class="sec"><div class="sec-h">② 다시 풀기</div>`;
    if(s.d!=='o' && !s.sv){
      if(!REC.err[p.id] && !s.lv && modeOf(p.id)!=='lock'){
        h+=errPickHTML(p,s); h+=`</div></div>`; return h;
      }
      h+=`<div class="muted">힌트를 하나 열고 <b>종이에 다시 풀어 보세요.</b> 그래도 막히면 다음 힌트를 열어요.</div>`+errLine(p)+hintSection(p,s);
      if(UI.causeFor===p.id) h+=`<div style="margin-top:14px;font-weight:900">처음에 왜 막혔나요? (틀렸나요?)</div><div class="causes">${causesOf(p.id).map(c=>`<button onclick="solve('${p.id}','${c.k}')">${c.label}</button>`).join('')}</div>`;
      else if(UI.cover[p.id]===1) h+=`<div class="cover">📄 <b>풀이를 덮었어요.</b> 이제 풀이를 보지 않고 <b>종이에 처음부터 혼자</b> 다시 써 보세요.<div class="next"><button style="background:var(--o)" onclick="UI.cover['${p.id}']=2;UI.causeFor='${p.id}';render();reveal('.causes')">✔ 혼자 다 썼어요</button> <button class="ghost mini" onclick="UI.cover['${p.id}']=0;render()">풀이 다시 보기</button></div></div>`;
      else h+=`<div class="next"><button style="background:var(--o)" onclick="readyToSolve('${p.id}')">✔ 이제 풀 수 있어요</button></div>`;
      if(s.lv>=s.n) h+=basicSuggest(p,'힌트를 다 봐도 어렵다면, 기초부터 다져 볼까요?');
    } else {
      if(!s.tw && (s.sv||s.d==='o')) h+=rulePickHTML(p);
      h+= s.sv? `<span class="done">✔ 해결했어요</span>${!s.tr.open?` <button class="ghost mini" onclick="unsolve('${p.id}')">취소</button>`:''}` : `<span class="muted">처음부터 맞힌 문제예요.${s.tw?' 바로 확인 문제로 가도 돼요.':''}</span>`;
      h+=`<div style="margin-top:8px"><button class="ghost mini" onclick="UI.showHints['${p.id}']=!UI.showHints['${p.id}'];render()">${UI.showHints[p.id]?'힌트 접기':'힌트·풀이 다시 보기'}</button></div>`;
      if(UI.showHints[p.id]) h+=hintSection(p,s);
    }
    h+=`</div>`;
  }
  /* ③ 확인 문제 */
  if(s.canTwin){
    h+=`<div class="sec"><div class="sec-h">③ 확인 문제 <span class="muted" style="font-weight:400">· 숫자만 바뀐 쌍둥이 문제</span></div>`;
    if(!s.tr.open) h+=`<button class="acc" onclick="askTwin('${p.id}')">📕 확인 문제 풀기</button>`;

  }
  return h+`</div>`;
}
/* 새로 열린 내용이 화면 아래에 숨지 않게 그 자리로 부드럽게 옮김 */
function reveal(sel){ requestAnimationFrame(()=>{ const els=document.querySelectorAll('#view '+sel), el=els[els.length-1]; if(!el) return;
  const r=el.getBoundingClientRect(); if(r.top<70||r.bottom>innerHeight-20) el.scrollIntoView({behavior:'smooth',block:r.height>innerHeight*0.6?'start':'center'}); }); }
function stuckFirst(pid){ REC.seen[pid]=true; REC.diag[pid]='t'; saveRec(); send({t:'diag',pid,v:'t'}); render(); reveal('.errpick'); }
function seeAns(pid){ REC.seen[pid]=true; saveRec(); send({t:'seen',pid}); render(); reveal('.marks'); }
function setDiag(pid,k){ if(k) REC.diag[pid]=k; else delete REC.diag[pid]; saveRec(); send({t:'diag',pid,v:k||null}); render(); }
function hintSection(p,s){
  const md=modeOf(p.id), lv=s.lv, n=s.n; let h='';
  if(md==='lock') return `<div class="lockmsg">🔒 선생님이 이 문제의 힌트를 잠갔어요. 함께 볼 거예요. 그동안 혼자 도전해 봐요!</div>`;
  const solShown=REC.hint[p.id]&&REC.hint[p.id].sol;
  for(let i=0;i<lv&&i<n;i++) h+=`<div class="hcard"><div class="hl">힌트 ${i+1} / ${n}</div>${p.hints[i]}${hintCheckHTML(p,i,i===lv-1&&!solShown)}</div>`;
  if(solShown && md==='all' && UI.cover[p.id]!==1) h+=`<div class="hcard sol"><div class="hl">풀이</div>${p.sol}<div class="rule">💡 ${p.rule}</div></div>`;
  const left=waitLeft(p.id), ask=lv>0&&ckOf(p,lv-1)&&!hintOk(p.id,lv-1);
  const wmsg=ask?`위 질문의 답을 맞히면 바로 열려요 · 아니면 ${left}초 뒤에 열 수 있어요`:`종이에 다시 풀어 보세요 · ${left}초 뒤에 열 수 있어요`;
  if(lv<n) h+=`<div class="next"><button class="acc" id="nextBtn" ${left?'disabled':''} onclick="openHint('${p.id}')">힌트 ${lv+1} 보기</button><span class="cd" id="cd">${left?wmsg:''}</span></div>`;
  else if(!solShown){
    if(md==='all') h+=`<div class="next"><button class="acc" id="nextBtn" ${left?'disabled':''} onclick="openSol('${p.id}')">풀이 보기</button><span class="cd" id="cd">${left?(ask?wmsg:`힌트로 다시 풀어 보세요 · ${left}초 뒤에 열 수 있어요`):''}</span></div>`;
    else h+=`<div class="lockmsg">힌트를 모두 봤어요. 풀이는 선생님이 열어 주시면 볼 수 있어요.</div>`;
  }
  return h;
}
/* 힌트 질문에 답하기: 맞히면 기다림 없이 다음 힌트(또는 풀이)가 열림. 못 맞혀도 시간이 지나면 열림 */
function ckOf(p,i){ const c=(p.checks||[])[i]; return Array.isArray(c)&&c.length?c:null; }
function hintAns(pid,i){ const h=REC.hint[pid]; return h&&h.ha&&h.ha['h'+(i+1)]||null; }
function hintOk(pid,i){ const a=hintAns(pid,i); return !!(a&&a.ok); }
function hintCheckHTML(p,i,active){
  const ck=ckOf(p,i); if(!ck) return '';
  const a=hintAns(p.id,i);
  if(a&&a.ok) return `<div class="hdone">✅ 맞았어요: ${ck.map((c,j)=>`${c.l} ${Number.isInteger(c.a)?c.a:esc(String((a.v||[])[j]??c.a))}${/^[°π]/.test(c.u)||!c.u?c.u:' '+c.u}`).join(', ')}</div>`;
  const ansTxt=()=>ck.map(c=>`${c.l} <b>${Number.isInteger(c.a)?c.a:fmtAns(c.a)}</b>${/^[°π]/.test(c.u)||!c.u?c.u:' '+c.u}`).join(', ');
  if(a&&a.gave) return `<div class="hdone" style="background:#f3f0ea;border-color:#cdbfa6;color:var(--ink)">🏳 포기했어요. 정답: ${ansTxt()} → 종이에 옮겨 쓰고, 왜 그런지 힌트를 다시 읽어 봐요.</div>`;
  if(!active) return '';
  const last=a&&Array.isArray(a.v)?a.v:[];
  return `<div class="hchk" data-pid="${p.id}" data-i="${i}">${ck.map((c,j)=>`<label>${c.l} <input class="hin" autocomplete="off" placeholder="${c.ph||''}" value="${esc(String(last[j]??''))}" onkeydown="if(event.key==='Enter')checkHint('${p.id}',${i})"> ${c.u}</label>`).join('')}
    <button class="acc" onclick="checkHint('${p.id}',${i})">답 확인</button>${CFG.lesson==='first'?`<button class="ghost" onclick="giveUpHint('${p.id}',${i})">🏳 포기</button>`:''}
    <div class="hm" id="hm">${a&&a.n?`아직 아니에요 (${a.n}번 시도). 힌트를 다시 읽고 종이에 써 보세요.`:'답을 적고 확인을 누르세요. 맞히면 다음 힌트를 바로 볼 수 있어요.'}</div></div>`;
}
function esc(v){ return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hintNum(v){ return parseNum(String(v).replace(/파이|pi/gi,'')); }
function checkHint(pid,i){
  if(MIRROR) return;
  const p=PBY[pid], ck=ckOf(p,i), box=document.querySelector(`#view .hchk[data-pid="${pid}"][data-i="${i}"]`); if(!ck||!box) return;
  const ins=[...box.querySelectorAll('input.hin')], vs=ins.map(x=>x.value.trim().slice(0,20));
  if(vs.some(v=>!v)){ toast('빈칸을 모두 채워 주세요'); return; }
  const oks=ck.map((c,j)=>{ const x=hintNum(vs[j]); return x!=null&&Math.abs(x-c.a)<1e-6; });
  const prev=hintAns(pid,i)||{}, ok=oks.every(Boolean);
  const h=Object.assign({},REC.hint[pid]); h.ha=Object.assign({},h.ha); h.ha['h'+(i+1)]={v:vs, ok, n:(prev.n||0)+1};
  if(ok) h.t=0;                      // 기다림 끝
  REC.hint[pid]=h; saveRec(); send({t:'hint',pid,lv:hintLv(pid)});
  if(ok){ toast(hintLv(pid)<p.hints.length?'맞아요! 다음 힌트를 바로 볼 수 있어요':'맞아요! 이제 다시 풀어 봐요'); render(); reveal('.next'); return; }
  ins.forEach((x,j)=>{ x.classList.toggle('bad',!oks[j]); x.classList.toggle('good',oks[j]); });
  const m=box.querySelector('#hm'); if(m) m.textContent=`아직 아니에요 (${h.ha['h'+(i+1)].n}번 시도).${ck.length>1?' 빨간 칸을 다시 생각해 보세요.':''} 힌트를 다시 읽고 종이에 써 보세요.`;
}
/* 첫 차시: 힌트 질문을 도저히 모르겠으면 포기 → 정답을 보여 줌 (포인트 없음, 다음 힌트 기다리는 시간은 그대로) */
function fmtAns(x){ for(let d=2;d<=24;d++){ const n=Math.round(x*d); if(Math.abs(n/d-x)<1e-9) return n+'/'+d; } return +x.toFixed(2); }
function giveUpHint(pid,i){ if(MIRROR) return; const p=PBY[pid], prev=hintAns(pid,i)||{};
  if(!confirm('포기하면 이 힌트 질문의 정답을 보여 줘요. 포인트는 받지 못해요. 포기할까요?')) return;
  const h=Object.assign({},REC.hint[pid]); h.ha=Object.assign({},h.ha); h.ha['h'+(i+1)]={v:prev.v||[], ok:false, n:prev.n||0, gave:true};
  REC.hint[pid]=h; saveRec(); send({t:'hint',pid,lv:hintLv(pid)}); render(); }
function openHint(pid){ const p=PBY[pid]; if(modeOf(pid)==='lock'||waitLeft(pid)) return;
  const lv=Math.min(p.hints.length,hintLv(pid)+1); REC.hint[pid]=Object.assign({},REC.hint[pid],{lv,t:Date.now()}); saveRec(); send({t:'hint',pid,lv}); render(); reveal('.hcard'); }
function openSol(pid){ if(modeOf(pid)!=='all'||waitLeft(pid)) return;
  REC.hint[pid]=Object.assign({},REC.hint[pid],{sol:true}); saveRec(); send({t:'hint',pid,lv:hintLv(pid),sol:true}); render(); reveal('.hcard.sol'); }
/* 풀이를 본 학생은 풀이를 덮고 혼자 다시 써 본 뒤에 '해결' */
function readyToSolve(pid){ const solShown=REC.hint[pid]&&REC.hint[pid].sol; if(solShown&&UI.cover[pid]!==2){ UI.cover[pid]=1; render(); reveal('.cover'); return; } UI.causeFor=pid; render(); reveal('.causes'); }
/* 틀리거나 막힌 학생: 힌트 전에 '어디서부터 달라졌나 / 어디서 막혔나'를 스스로 찾기 */
function errPickHTML(p,s){
  const q= s.d==='x'? '힌트를 보기 전에 <b>내 풀이</b>를 다시 봐요. 어디서부터 정답과 달라졌나요?' : '힌트를 보기 전에, 어디에서 막혔는지 골라 봐요.';
  return `<div class="errpick"><div style="font-weight:900;margin-bottom:6px">🔎 ${q}</div><div class="causes">${causesOf(p.id).map(c=>`<button onclick="pickErr('${p.id}','${c.k}')">${c.label}</button>`).join('')}</div>
    <div class="muted" style="margin-top:6px;font-size:14px">고른 곳에 맞는 힌트부터 볼 수 있어요.</div></div>`;
}
function errLine(p){ const k=REC.err[p.id]; if(!k) return ''; const c=CBY[k]; return c?`<div class="muted" style="margin-top:4px;font-size:14px">🔎 내가 찾은 곳: <b>${c.label}</b></div>`:''; }
function pickErr(pid,k){
  const p=PBY[pid], c=CBY[k]||{}, h=Math.max(0,Math.min(p.hints.length-1,+c.h||0));
  REC.err=Object.assign({},REC.err,{[pid]:k});
  if(h>hintLv(pid)){ REC.hint[pid]=Object.assign({},REC.hint[pid],{lv:h,t:0}); }
  saveRec(); send({t:'err',pid,k}); render();
  toast(h? `앞의 힌트 ${h}개는 이미 아는 내용이라 열어 두었어요. 힌트 ${h+1}부터 봐요` : '좋아요. 힌트 1부터 차근차근 봐요');
  reveal(h?'.next':'.sec');
}
function solve(pid,cause){ REC.solved[pid]={lv:hintLv(pid),cause,sol:!!(REC.hint[pid]&&REC.hint[pid].sol)}; UI.causeFor=null; saveRec(); send({t:'solved',pid,on:true,cause}); render(); toast('좋아요! 이제 확인 문제로 실력을 확인해요'); }
function unsolve(pid){ delete REC.solved[pid]; saveRec(); send({t:'solved',pid,on:false}); render(); }
function basicSuggest(p,msg){
  if(!BT.length) return '';
  const ks=(U.basicFor||{})[p.id]||[];
  return `<div class="suggest"><div class="b">🧱 ${msg}</div>${ks.map(k=>`<button onclick="go('bt','${k}')">${BBY[k].name}</button>`).join('')}<button style="background:#fff;color:#7a4fb5;border:2px solid #b89ad8" onclick="go('bas','${p.id}')">다른 기초 유형</button></div>`;
}
/* 확인 문제 */
function askTwin(pid){ $('askOv').classList.add('on'); $('askGo').onclick=()=>{ $('askOv').classList.remove('on'); const tw=TOF[pid]; REC.twin[tw.id]=Object.assign({},REC.twin[tw.id],{open:true}); saveRec(); send({t:'twinOpen',tid:tw.id}); render(); }; }
function twinBlock(p,s){
  const t=s.tw, tr=s.tr, done=tr.a!=null, f=t.fig?t.fig():'', pick=UI.twinPick[t.id];
  let h=`<div class="twbox"><div class="pbox ${f?'':'nofig'}"><div class="ptext">${t.text}</div>${f?`<div class="figw">${f}</div>`:''}</div>`;
  if(t.inp) h+=twinInputHTML(t,tr);
  else h+=`<div class="chs">${t.ch.map((c,i)=>{ let cls=''; if(done){ if(i===t.ok) cls='right'; else if(i===tr.a) cls='wrong'; } else if(i===pick) cls='sel';
      return `<button class="${cls}" ${done?'disabled style="opacity:1"':''} onclick="UI.twinPick['${t.id}']=${i};render()"><span class="n">${NUM[i]}</span>${c}</button>`; }).join('')}</div>`;
  if(!done) h+= t.inp? `<div class="next"><button class="acc" onclick="submitTwinNum('${t.id}')">제출 (한 번만)</button>${CFG.lesson==='first'?`<button class="ghost" onclick="giveUpTwin('${t.id}')">🏳 포기</button>`:''}<span class="cd">종이에 풀고 답을 적어요 · π는 π 또는 파이, 분수는 56/3π처럼</span></div>`
    : `<div class="next"><button class="acc" ${pick==null?'disabled':''} onclick="submitTwin('${t.id}')">제출 (한 번만)</button><span class="cd">종이에 풀고 답을 골라요</span></div>`;
  else {
    h+= tr.a===t.ok? `<div class="verdict r">⭕ 정답이에요! 이 문제는 완성!</div>` : `<div class="verdict w">❌ 아쉬워요</div>`;
    if(t.inp) h+=`<div class="muted" style="font-weight:700">${tr.gave?'🏳 포기했어요':`내 답: ${esc((tr.v||[]).join(t.ratio?' : ':', '))}`} · 정답: ${t.ch[t.ok]}</div>`;
    if(tr.a!==t.ok && REC.diag[p.id]==='o') h+=`<div class="over">🤔 처음엔 <b>○(맞았어요)</b>로 채점했는데 이번엔 달랐어요. 처음 답이 정말 이해해서 맞힌 것이었는지 한 번 더 따져 봐요.</div>`;
    h+=rulePickHTML(p);
    h+=`<div class="exp">${t.exp}</div>`;
    if(tr.a!==t.ok){
      if(!tr.cause) h+=`<div style="margin-top:12px;font-weight:900">무엇을 놓쳤나요?</div><div class="causes">${causesOf(t.of).map(c=>`<button onclick="twinCause('${t.id}','${c.k}')">${c.label}</button>`).join('')}</div>`;
      else h+=`<div class="muted" style="margin-top:8px;font-weight:700">놓친 것: ${(CBY[tr.cause]||{}).label||''}</div>`;
      h+=`<div class="suggest" style="background:var(--acc-soft)"><div class="b">위의 <b>힌트·풀이 다시 보기</b>로 원래 문제를 다시 풀어 봐요.</div></div>`+basicSuggest(p,'기초 유형으로 연습해 볼까요?');
    }
  }
  return h+`</div>`;
}
/* 확인 문제 답 입력: 적은 값이 어느 보기와 같은지로 실수를 알아냄 (어느 것도 아니면 '기타' = 보기 수) */
function piVal(v){ let t=String(v).replace(/파이|pi/gi,'π').replace(/cm²|cm|°|㎠|[\s()]/g,'').replace(/[－−]/g,'-').replace(/,/g,'');
  if(!t) return null; const terms=t.match(/[+-]?[^+-]+/g)||[]; let a=0,b=0;
  for(const raw of terms){ let sg=1, x=raw; if(x[0]==='+') x=x.slice(1); else if(x[0]==='-'){ sg=-1; x=x.slice(1); }
    if(x.includes('π')){ const c=x.replace('π',''); const n= c===''?1 : c.startsWith('/')? 1/(parseNum(c.slice(1))||NaN) : parseNum(c); if(n==null||!Number.isFinite(n)) return null; b+=sg*n; }
    else { const n=parseNum(x); if(n==null) return null; a+=sg*n; } }
  return [a,b]; }
function sameVal(x,y){ return x&&y&&Math.abs(x[0]-y[0])<1e-6&&Math.abs(x[1]-y[1])<1e-6; }
function twinMatch(t,vs){ const got=vs.map(piVal); if(got.some(g=>!g)) return null;
  for(let i=0;i<t.vals.length;i++){ const w=t.vals[i].map(piVal);
    if(t.ratio){ if(got[0][0]*w[1][0]===got[1][0]*w[0][0] && got[0][0]>0) return i; }
    else if(w.every((x,j)=>sameVal(x,got[j]))) return i; }
  return t.ch.length; }
function twinInputHTML(t,tr){ if(tr.a!=null) return '';
  return `<div class="numin" style="flex-wrap:wrap">${t.inp.map((c,j)=>`${c.l?`<span class="sfx">${c.l}</span>`:''}<input class="twin-in" type="text" autocomplete="off" style="width:${t.ratio?70:130}px"><span class="sfx">${c.u||''}</span>`).join('')}</div>`; }
function giveUpTwin(tid){ const t=TBY[tid]; if(MIRROR||!t||(REC.twin[tid]&&REC.twin[tid].a!=null)) return;
  if(!confirm('포기하면 정답과 풀이를 보여 줘요. 확인 문제는 틀린 것으로 남아요. 포기할까요?')) return;
  REC.twin[tid]=Object.assign({},REC.twin[tid],{a:t.ch.length, v:['포기'], gave:true, open:true}); saveRec(); send({t:'twinAns',tid,a:t.ch.length}); render(); reveal('.verdict'); }
function submitTwinNum(tid){ const t=TBY[tid]; if(!t||(REC.twin[tid]&&REC.twin[tid].a!=null)) return;
  const vs=[...document.querySelectorAll('#view input.twin-in')].map(x=>x.value.trim().slice(0,30)); if(vs.some(v=>!v)){ toast('빈칸을 모두 채워 주세요'); return; }
  const a=twinMatch(t,vs); if(a==null){ toast('수와 π로만 적어 주세요. 예: 4π, 8π-16, 56/3π'); return; }
  REC.twin[tid]=Object.assign({},REC.twin[tid],{a,v:vs,open:true}); saveRec(); send({t:'twinAns',tid,a}); render(); reveal('.verdict'); }
/* 핵심 생각 고르기: 이 문제의 💡 규칙을 다른 문제의 규칙과 구별 */
function ruleChoices(p){ const others=P.filter(q=>q.id!==p.id&&q.rule&&q.rule!==p.rule); const diff=others.filter(q=>q.group!==p.group), pool=(diff.length>=2?diff:others);
  const i=P.indexOf(p), pick=[pool[i%pool.length],pool[(i+1)%pool.length]].filter(Boolean);
  const arr=[p,...pick]; const order=[(i)%3,(i+1)%3,(i+2)%3]; return order.map(k=>arr[k]).filter(Boolean); }
function rulePickHTML(p){ if(!p.rule) return ''; const r=REC.rule[p.id], ch=ruleChoices(p);
  if(r) return `<div class="rulebox ${r.ok?'ok':''}">💡 이 문제의 핵심 생각: <b>${p.rule}</b>${r.ok?' ✔':' <span class="muted">(처음엔 다른 것을 골랐어요)</span>'}</div>`;
  return `<div class="rulebox"><div style="font-weight:900;margin-bottom:6px">💡 이 문제의 핵심 생각은 무엇이었나요?</div><div class="causes">${ch.map(q=>`<button onclick="pickRule('${p.id}','${q.id}')">${q.rule}</button>`).join('')}</div></div>`; }
function pickRule(pid,qid){ REC.rule=Object.assign({},REC.rule,{[pid]:{ok:pid===qid}}); saveRec(); send({t:'rule',pid}); render(); toast(pid===qid?'맞아요! 공책에도 적어 두세요':'아쉬워요. 맞는 핵심 생각을 확인해요'); }
function submitTwin(tid){ const a=UI.twinPick[tid]; if(a==null||(REC.twin[tid]&&REC.twin[tid].a!=null)) return;
  REC.twin[tid]=Object.assign({},REC.twin[tid],{a,open:true}); saveRec(); send({t:'twinAns',tid,a}); render(); reveal('.verdict'); }
function twinCause(tid,c){ REC.twin[tid]=Object.assign({},REC.twin[tid],{cause:c}); saveRec(); send({t:'twinCause',tid,cause:c}); render(); }

/* ---------- 기초 연습 ---------- */
function bstat(k){ return REC.bas[k]||{n:0,ok:0,streak:0,star:false,recent:[]}; }
function viewBas(){
  const rec=UI.rec?(U.basicFor||{})[UI.rec]||[]:[];
  let h=`<div class="phase-h">🧱 기초 연습</div><div class="phase-d">1쪽 기초 유형을 반복해서 연습해요. 문제는 풀 때마다 새로 나와요. <b>연속 3개</b>를 맞히면 ⭐!</div><div class="btypes">`;
  for(const b of BT){ const st=bstat(b.k);
    h+=`<button class="btype ${rec.includes(b.k)?'rec':''}" onclick="go('bt','${b.k}')"><b>${b.name} ${st.star?'<span class="stars">⭐</span>':''}</b><div class="d">${b.desc}</div>
      <div class="s">${st.n?`푼 문제 ${st.n} · 맞힌 문제 ${st.ok}`:'아직 안 풀었어요'}${rec.includes(b.k)?' · <span style="color:#7a4fb5">추천</span>':''}</div></button>`; }

  if(q.rule==null) h+=`<div style="font-weight:900;margin-top:12px">💡 이 문제에 쓸 핵심 생각은?</div><div class="causes">${ts.map(b=>`<button onclick="mixRule('${b.k}')">${b.rule}</button>`).join('')}</div>`;

function mixRule(k){ const M=UI.MX, q=M.qs[M.i]; q.rule=(k===q.k); mixSave(); render(); }
function mixAns(){ const M=UI.MX, q=M.qs[M.i], inp=document.querySelector('#view input.mix-in'); if(!inp) return; const v=inp.value.trim(); if(!v) return;

/* ---------- 🎲 주사위 맞히기 (포인트와 따로. 선생님이 열었을 때만) ---------- */
const STK={oe:['🐶','🐱','🐰','🦊','🐻','🐼','🐨','🐯','🐸','🐧'], num:['🦄','🐉','🌈','💎','🚀','👑']};
function rnd6(){ try{ const a=new Uint32Array(1); crypto.getRandomValues(a); return 1+a[0]%6; }catch(e){ return 1+Math.floor(Math.random()*6); } }
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function dieHTML(v,roll){ return `<div class="die ${roll?'roll':''}" id="die">${[0,1,2,3,4,5,6,7,8].map(i=>`<i class="${(PIPS[v]||[]).includes(i)?'on':''}"></i>`).join('')}</div>`; }

  const sk=Object.keys(st); h+=`<div class="card"><b>🏅 내 스티커</b> <span class="muted">${sk.reduce((a,k)=>a+st[k],0)}개</span><div class="stk" style="margin-top:8px">${sk.length?sk.map(k=>`<span>${k}${st[k]>1?`<small>×${st[k]}</small>`:''}</span>`).join(''):'<span class="muted" style="font-size:15px;background:none;border:0">아직 없어요</span>'}</div></div>`;
  if(rolls.length){ const c=[1,2,3,4,5,6].map(f=>rolls.filter(x=>x===f).length), mx=Math.max(1,...c);

function rollDie(){

  const M=UI.gmode, pick=UI.gpick, v=rnd6(), ok= M==='oe'? (v%2===1)===(pick==='odd') : v===pick;
  const g=Object.assign({used:0,st:{},rolls:[],hit:{}},REC.game); g.used=(+g.used||0)+1; g.rolls=arrOf(g.rolls).concat([v]).slice(-60);

  let s=null; if(ok){ s=ULIB.rnd(STK[M]); g.st=Object.assign({},g.st); g.st[s]=(g.st[s]||0)+1; }

  UI.rolling=true; UI.last={v,ok,s}; render();

}

/* ---------- 수업 연결 (Firebase Realtime Database) ----------
   classes/{코드}/cfg          ← 선생님이 씀: 기다리는 시간, 문제별 잠금, 멈춤, 초기화 시각

   classes/{코드}/stu/{이름}/p   ← 접속 표시·현재 위치 (내가 씀)
------------------------------------------------------------ */
const FB_OK=!!(window.firebase && window.FB_CONFIG && FB_CONFIG.apiKey && FB_CONFIG.databaseURL);
let db=null; if(FB_OK){ try{ firebase.initializeApp(FB_CONFIG); db=firebase.database(); }catch(e){ console.error(e); } }
const TS=FB_OK?firebase.database.ServerValue.TIMESTAMP:0;
const CL={code:null,key:null,base:null,connected:false};
let deviceId; try{ deviceId=sessionStorage.getItem('ur-tab'); if(!deviceId){ deviceId=Math.random().toString(36).slice(2,12); sessionStorage.setItem('ur-tab',deviceId);} }catch(e){ deviceId=Math.random().toString(36).slice(2,12); }
const fbKey=n=>encodeURIComponent(n).replace(/\./g,'%2E');
function setState(t,ok){ const el=$('classState'); el.textContent=t; el.classList.toggle('ok',!!ok); }
function me(){ return CL.base.child('stu/'+CL.key); }
/* 예전 메시지 방식 그대로 부름: loc 은 접속 표시에, 나머지는 내 기록을 올림 */
function send(o){
  if(DEMO||!CL.base) return;
  if(o.t==='loc'){ me().child('p').update({loc:o.v}).catch(()=>{}); return; }
  clearTimeout(CL.upT); CL.upT=setTimeout(upload,250);

function dbClean(x){ return JSON.parse(JSON.stringify(x,(k,v)=>v===undefined?null:v)); }
function upload(){ if(!CL.base) return; const r=dbClean(REC); r.progT=TS; me().child('rec').set(r).catch(e=>toast('저장 실패: '+e.message)); }
/* 기기 기록 + 서버 기록 합치기 (새로고침·기기 바꿈 대비) */
function mergeRec(a,b){
  const r=Object.assign(emptyRec(), JSON.parse(JSON.stringify(a||{})));
  b=b||{};
  for(const k in (b.diag||{})) if(!r.diag[k]) r.diag[k]=b.diag[k];
  for(const k in (b.seen||{})) r.seen[k]=true;
  for(const k in (b.hint||{})){ const x=r.hint[k]||{}, y=b.hint[k]||{}; r.hint[k]={lv:Math.max(x.lv||0,y.lv||0), sol:!!(x.sol||y.sol), t:x.t||0};
    const ha=Object.assign({},y.ha,x.ha); for(const q in ha){ const xa=(x.ha||{})[q], ya=(y.ha||{})[q]; if(xa&&ya) ha[q]=(ya.ok&&!xa.ok)||(ya.ok===xa.ok&&(ya.n||0)>(xa.n||0))?ya:xa; } if(Object.keys(ha).length) r.hint[k].ha=ha; }
  for(const k in (b.solved||{})) if(!r.solved[k]) r.solved[k]=b.solved[k];
  for(const k in (b.twin||{})){ const x=Object.assign({},r.twin[k]), y=b.twin[k]||{}; if(y.open) x.open=true; if(x.a==null&&y.a!=null){ x.a=y.a; if(y.v) x.v=y.v; if(y.gave) x.gave=true; } if(!x.cause&&y.cause) x.cause=y.cause; r.twin[k]=x; }
  for(const k in (b.bas||{})){ const x=r.bas[k], y=b.bas[k]||{}; if(!x||(y.n||0)>(x.n||0)) r.bas[k]=y; }
  r.resetSeen=Math.max(r.resetSeen||0,b.resetSeen||0);
  r.mergedAt=Math.max(r.mergedAt||0,+b.mergedAt||0);
  r.err=Object.assign({},b.err,r.err); r.rule=Object.assign({},b.rule,r.rule);
  { const x=r.game||{}, y=b.game||{}; if((+y.used||0)>(+x.used||0)) r.game=y; }
  if(b.mix&&(!r.mix||(+b.mix.at||0)>(+r.mix.at||0)||((+b.mix.at||0)===(+r.mix.at||0)&&(+b.mix.n||0)>(+r.mix.n||0)))) r.mix=b.mix;
  return r;
}
function applyCfg(c){
  if(!c) return;
  if(c.resetAt && c.resetAt>(REC.resetSeen||0)){   // 선생님이 기록을 초기화함
    REC=emptyRec(); REC.resetSeen=c.resetAt; saveRec(); upload(); toast('선생님이 기록을 새로 시작했어요');
  }
  CFG={wait:Math.max(0,+c.wait||0), mode:c.mode||{}, lesson:c.lesson==='first'?'first':'review', mix:+c.mix||0, game:c.game===1?1:0, bb:c.bb===1?1:0, bbS:(c.bbS&&typeof c.bbS==='object')?c.bbS:{}, bbMax:Math.max(0,Math.min(100,+c.bbMax||0))};
  document.body.classList.toggle('fig-bold',c.fig==='bold');
  $('pauseOv').classList.toggle('on',!!c.paused); if(c.pauseMsg) $('pauseMsg').textContent=c.pauseMsg;
  const v=+c.ver||0; if(v&&v!==APP_VER&&CL.verWarn!==v){ CL.verWarn=v; const m=v>APP_VER?'⚠ 새 버전이 있어요. 이 화면을 새로고침해 주세요.':'⚠ 선생님 화면이 옛 버전이에요. 선생님께 새로고침을 부탁하세요.'; toast(m,6000); }
  if(UI.view!=='bt') render();
}
function joinClick(){
  const code=$('classCode').value.replace(/\D/g,'');
  const nm=normName($('myName').value);
  if(!nm){ setState('먼저 번호와 이름을 입력하세요.'); $('myName').focus(); return; }
  if(!nameOk(nm)){ setState('번호와 이름을 함께 써 주세요. (예: 7 김민준)'); $('myName').focus(); return; }
  $('myName').value=nm;
  if(code.length!==4){ setState('수업 코드 4자리를 입력하세요.'); return; }
  LS.set('ur-name',nm); LS.set('ur-class',code);
  connect(code);
}
function showMain(){ $('home').classList.add('hide'); $('main').classList.remove('hide'); $('who').textContent='👤 '+myName(); render(); }
function goHome(){ disconnect(); $('pauseOv').classList.remove('on'); $('main').classList.add('hide'); $('home').classList.remove('hide'); setState(''); }
function setConn(on){
  CL.connected=on; $('connDot').classList.toggle('on',on); $('connTxt').textContent=on?'연결됨':'연결 끊김 · 기록은 다시 연결되면 올라가요';
}
function disconnect(){
  clearTimeout(CL.upT); clearTimeout(CL.joinT);
  if(CL.base){ try{ me().child('uid').off(); me().child('rec/mergedAt').off(); me().child('p').update({online:false}).catch(()=>{}); me().child('p').onDisconnect().cancel().catch(()=>{}); }catch(e){} try{ CL.base.child('cfg').off(); }catch(e){} }
  try{ db&&db.ref('.info/connected').off(); }catch(e){}
  if(typeof bbOff==='function') bbOff();
  CL.base=null; CL.code=null; setConn(false);
}
function connect(code){
  if(!FB_OK||!db){ setState('⚠ 연결 설정(firebase-config.js)이 아직 없어요. 선생님께 알려 주세요.'); return; }
  disconnect(); CL.code=code; loadRec();
  setState('수업을 찾는 중…');
  const base=db.ref('classes/'+code), my=CL.code;
  CL.joinT=setTimeout(()=>{ if(CL.code===my&&!CL.base) setState('⏳ 서버 응답이 늦어요. 와이파이를 확인하세요. 계속 기다리는 중…'); },10000);
  let cfgSnap=null;
  authReady().then(uid=>(CL.uid=uid, base.child('cfg').once('value').then(snap=>{
    if(CL.code!==my) return;
    if(!snap.exists()){ clearTimeout(CL.joinT); CL.code=null; setState(`수업 ${code}을(를) 찾지 못했어요. 선생님 화면이 열려 있는지, 코드가 맞는지 확인하세요.`); return; }
    /* 선생님이 고른 단원이 지금 화면과 다르면 그 단원으로 다시 열기 */
    const cu=(snap.val()||{}).unit;
    if(cu && cu!==U.id){ clearTimeout(CL.joinT);
      if(unitExists(cu)){ setState('수업 단원으로 바꾸는 중…'); LS.set('ur-unit',cu); location.replace(location.pathname+'?c='+code+'&u='+encodeURIComponent(cu)); }
      else { CL.code=null; setState('이 수업의 단원을 찾지 못했어요. 화면을 새로고침해 보고, 그래도 안 되면 선생님께 알려 주세요.'); }
      return; }
    cfgSnap=snap; CL.key=fbKey(myName()); CL.base=base;
    /* 이 이름을 이 기기 것으로 표시 (다른 기기가 먼저 쓰고 있으면 규칙이 막음) */
    return me().child('uid').set(uid).catch(e=>{
      if(CL.code!==my) return;
      const err=new Error(isDenied(e)
        ? `'${myName()}' 이름은 다른 기기에서 이미 쓰고 있어요. 번호와 이름이 맞는지 확인하세요. 기기를 바꿨다면 선생님께 [🔓 기기 바꾸기]를 부탁하세요.`
        : '연결 오류: '+e.message);
      err.ui=true; throw err;
    }).then(()=>me().child('rec').once('value'));
  }))).then(rs=>{
    if(CL.code!==my||!cfgSnap||!rs) return;
    clearTimeout(CL.joinT);
    REC=mergeRec(REC, rs.val()); saveRec();
    applyCfg(cfgSnap.val()); upload();
    db.ref('.info/connected').on('value',s=>{ const on=!!s.val(); if(on&&CL.base===base){ const p=me().child('p'); p.onDisconnect().update({online:false}); p.update({online:true,name:myName(),dev:deviceId,ver:APP_VER,loc:lastLoc||'',t:TS}); } setConn(on); });
    base.child('cfg').on('value',s=>applyCfg(s.val()));
    /* 선생님이 [기기 바꾸기]·[기록 합치기]로 이 이름을 다른 기기로 넘기면 첫 화면으로 */
    me().child('uid').on('value',s=>{ if(CL.base===base && s.val()!==CL.uid) kicked(); }, ()=>{ if(CL.base===base) kicked(); });
    /* 선생님이 다른 이름의 기록을 이 이름으로 합치면 받아 옴 */
    me().child('rec/mergedAt').on('value',s=>{ const v=+s.val()||0; if(CL.base!==base||v<=(REC.mergedAt||0)) return;
      me().child('rec').once('value').then(rs=>{ REC=mergeRec(REC,rs.val()); REC.mergedAt=v; saveRec(); upload(); if(UI.view!=='bt') render(); toast('선생님이 기록을 합쳐 주었어요'); }).catch(()=>{}); }, ()=>{});
    bbOnConnect(base);
    setState(`✔ 수업 ${code}에 연결됨`,true); showMain(); lastLoc=''; reportLoc();
  }).catch(e=>{ if(CL.code!==my) return; clearTimeout(CL.joinT); CL.code=null; CL.base=null; setState('❌ '+(e.ui?e.message:authMsg(e))); });
}
/* 익명 로그인: 기기마다 보이지 않는 번호(uid)가 생기고, 데이터베이스 규칙이 이 번호로 '내 기록'을 구분함 */
let authP=null;
function authReady(){
  if(!authP) authP=new Promise((res,rej)=>{
    const un=firebase.auth().onAuthStateChanged(u=>{ un();
      if(u) res(u.uid); else firebase.auth().signInAnonymously().then(c=>res(c.user.uid)).catch(e=>{ authP=null; rej(e); }); });
  });
  return authP;
}
function isDenied(e){ return /permission|denied/i.test(String((e&&(e.code||''))+' '+(e&&e.message||''))); }
function authMsg(e){
  const c=String(e&&e.code||'');
  if(/admin-restricted|operation-not-allowed/.test(c)) return '익명 로그인이 꺼져 있어요. 선생님께 알려 주세요. (Firebase 콘솔 → Authentication → 익명)';
  if(isDenied(e)) return '데이터베이스가 접근을 막았어요. 선생님께 알려 주세요. ('+e.message+')';
  return '연결 오류: '+(e&&e.message||e);
}
/* 교사 화면이 보내 준 학생 기록으로 같은 화면을 보여 줌 (저장·전송 안 함) */
function startMirror(){
  addEventListener('message',e=>{
    if(e.origin!==location.origin||!e.data||e.data.type!=='mirror') return;
    const d=e.data; REC=Object.assign(emptyRec(), d.rec||{}); CFG={wait:Math.max(0,+(d.cfg&&d.cfg.wait)||0), mode:(d.cfg&&d.cfg.mode)||{}, lesson:d.cfg&&d.cfg.lesson==='first'?'first':'review', mix:+(d.cfg&&d.cfg.mix)||0, game:d.cfg&&d.cfg.game===1?1:0, bb:0, bbMax:10}; document.body.classList.toggle('fig-bold',!!(d.cfg&&d.cfg.fig==='bold'));
    $('who').textContent='👤 '+d.name;
    if(d.loc!=null){   // 학생이 지금 있는 곳으로
      const p=P.find(x=>d.loc.startsWith(x.no)), b=(d.loc.match(/^기초 (\S+)$/)||[])[1];
      if(p){ if(UI.view!=='prob'||UI.pid!==p.id) return go('prob',p.id); }
      else if(b&&BBY[b]){ if(UI.view!=='bt'||UI.bt!==b) return go('bt',b); }
      else if(/^기초 연습/.test(d.loc)){ if(UI.view!=='bas') return go('bas'); }
      else if(/^문제 목록/.test(d.loc)){ if(UI.view!=='list') return go('list'); }
    }
    if(UI.view!=='bt') render();
  });
}
function kicked(){ const nm=myName(); goHome(); setState(`'${nm}' 이름이 다른 기기로 넘어갔거나 선생님이 기록을 정리했어요. 번호와 이름을 확인하고 다시 들어오세요.`); }

/* ---------- 시작 ---------- */
(function init(){
  const n=normName(LS.get('ur-name','')); if(n) $('myName').value=n;
  if(DEMO){ $('myName').value='시연'; loadRec(); $('connTxt').textContent=MIRROR?'👀 선생님 화면에서 보는 중':'시연 (연결 없음)'; showMain(); if(MIRROR) startMirror(); return; }
  let code=null; try{ const q=new URLSearchParams(location.search).get('c'); if(q&&/^\d{4}$/.test(q)) code=q; }catch(e){}
  if(!code) code=LS.get('ur-class',null);
  if(!FB_OK) setState('⚠ 연결 설정(firebase-config.js)이 아직 없어요.');
  if(code){ $('classCode').value=code; if(nameOk(n)) setTimeout(()=>connect(code),200); else setState('번호와 이름을 입력하고 [수업 들어가기]를 누르세요.'); }
})();
$('myName').addEventListener('change',()=>{ const v=normName($('myName').value); $('myName').value=v; LS.set('ur-name',v); });
</script>
