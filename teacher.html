<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교사용 · 단원 마무리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="unit.js"></script>
<style>
body{font-size:16px}
.wrap{max-width:1380px;margin:0 auto;padding:14px 18px 40px}
.head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.head h1{font-size:22px;font-weight:900}
.head .codebox{display:flex;align-items:baseline;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.head .code{font-size:34px;font-weight:900;letter-spacing:6px;color:var(--acc)}
.head .url{font-size:13px;color:var(--muted);max-width:330px;word-break:break-all}
.head .sp{flex:1}
#badge{font-size:14px;font-weight:700;color:var(--muted)}
#badge.on{color:var(--o)}
button.sm{padding:7px 12px;font-size:14px}
.cols{display:grid;grid-template-columns:280px 1fr;gap:14px;align-items:start}
.side .card h3{font-size:15px;margin-bottom:8px}
.stu{list-style:none;max-height:520px;overflow:auto}
.stu li{display:flex;align-items:center;gap:8px;padding:5px 2px;border-bottom:1px solid #f0ece3;font-size:15px}
.stu li .dot{width:9px;height:9px;border-radius:50%;background:#ccc;flex:none}
.stu li .dot.on{background:var(--o)}
.stu li .nm{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stu li .pr{font-size:12px;color:var(--muted);white-space:nowrap}
.stu li .rm{background:none;color:#bbb;padding:0 4px;font-size:14px}
.stu li.off .nm{color:#999}
.side input,.side select{width:100%;font-size:14px;padding:7px 9px}
.side .btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{background:#fff;color:var(--ink);border:2px solid var(--line);font-size:15px;padding:8px 14px}
.tabs button.sel{border-color:var(--ink);background:var(--ink);color:#fff}
.tabs button .cnt{display:inline-block;min-width:20px;border-radius:999px;background:var(--x);color:#fff;font-size:12px;padding:0 6px;margin-left:4px}
.tool{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tool .info{color:var(--muted);font-weight:700}
.grp{font-size:13px;font-weight:900;color:var(--muted);margin:14px 0 6px;letter-spacing:.5px}
.grp b{color:var(--ink)}
.prow{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px}
.prow .l1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.prow .no{font-size:22px;font-weight:900;width:30px}
.prow .tt{font-weight:700;width:190px}
.bar{flex:1;min-width:200px;height:26px;border-radius:8px;background:#efece5;display:flex;overflow:hidden}
.bar>div{height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:13px}
.seg-o{background:var(--o)}.seg-t{background:var(--t)}.seg-x{background:var(--x)}.seg-n{background:#cfcac0}
.cnt2{font-size:14px;color:var(--muted);white-space:nowrap}
.names{margin-top:8px;font-size:14px;line-height:1.8}
.names .tag{display:inline-block;background:#f4f1ea;border-radius:8px;padding:0 8px;margin:0 4px 4px 0}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border-radius:0;background:#fff;color:var(--ink);padding:6px 10px;font-size:13px}
.seg button.sel{background:var(--ink);color:#fff}
.seg button.sel.lock{background:#777}.seg button.sel.all{background:var(--o)}
.stat{font-size:14px;margin-top:6px;line-height:1.7}
.stat .m{color:var(--muted)}
table.mx{border-collapse:collapse;width:100%;background:#fff;font-size:14px}
table.mx th,table.mx td{border:1px solid #eee7da;padding:5px 6px;text-align:center}
table.mx th{background:#f7f4ee}
table.mx td.nm{text-align:left;font-weight:700;white-space:nowrap}
table.mx td .lv{font-size:12px;color:var(--muted)}
table.mx td.ok{background:var(--o-soft)} table.mx td.bad{background:var(--x-soft)}
.help{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.hc{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.hc.hot{border-color:var(--x)}
.hc .nm{font-weight:900;font-size:18px}
.hc .loc{font-size:13px;color:var(--muted);font-weight:700}
.chip{display:inline-block;border-radius:8px;padding:2px 8px;margin:6px 6px 0 0;font-size:13px;font-weight:700}
.chip.r{background:var(--x-soft);color:var(--x)}.chip.y{background:var(--t-soft);color:#946a00}.chip.p{background:#f1e8fb;color:#6b3fa6}.chip.g{background:#eee;color:#555}
.okline{margin-top:14px;font-size:14px;line-height:1.9}
.okline .tag{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:8px;padding:0 8px;margin:0 4px 4px 0}
.twc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.twc .q{display:grid;grid-template-columns:1fr 150px;gap:12px;margin-top:6px;font-size:15px}
.chrow{display:grid;grid-template-columns:200px 1fr 54px;gap:8px;align-items:center;margin-top:5px;font-size:15px;cursor:pointer}
.chrow .cb{height:22px;background:#efece5;border-radius:6px;overflow:hidden}
.chrow .cb>div{height:100%;background:#9aa7bd}
.chrow.ok .cb>div{background:var(--o)}
.chrow .why{grid-column:2/4;font-size:12px;color:var(--muted);margin-top:-3px}
.pv{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.pv .q{display:grid;grid-template-columns:1fr 260px;gap:14px}
.pv ol{margin:8px 0 0 22px}
.pv li{margin-bottom:4px}
.blank{display:inline-block;min-width:3em;border-bottom:2px solid var(--ink)}
.sent{margin-top:6px}
#big{position:fixed;inset:0;background:#fff;z-index:40;display:none;padding:26px 40px;overflow:auto}
#big.on{display:block}
#big h2{font-size:32px;font-weight:900;margin-bottom:16px}
#big .brow{display:flex;align-items:center;gap:18px;margin-bottom:14px;font-size:22px}
#big .brow .no{font-size:32px;font-weight:900;width:46px}
#big .brow .bar{height:42px}
#big .brow .bar>div{font-size:19px}
#big .close{position:fixed;right:20px;top:16px}
@media (max-width:1000px){ .cols{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1 id="ttl">교사용</h1>
    <div class="codebox"><span class="muted">수업 코드</span><span class="code" id="code">----</span></div>
    <div><div class="url" id="url"></div><button class="ghost sm" onclick="copyURL()" style="margin-top:4px">학생 주소 복사</button></div>
    <span class="sp"></span>
    <span id="badge">연결 준비 중…</span>
    <a id="demoLink" target="_blank"><button class="ghost sm">🎬 학생 화면 미리보기</button></a>
    <button class="sm acc" onclick="openBig()">📺 크게 보기</button>
  </div>
  <div class="err" id="peerErr" style="color:var(--x);margin-bottom:8px"></div>

  <div class="cols">
    <div class="side">
      <div class="card"><h3>학생 <span class="muted" id="stuCnt"></span></h3><ul class="stu" id="stuList"></ul></div>
      <div class="card"><h3>✋ 전체 멈춤 <span class="muted" style="font-weight:400">(함께 볼 때)</span></h3>
        <input id="pauseMsg" type="text" maxlength="40">
        <button id="pauseBtn" style="width:100%;margin-top:6px" onclick="togglePause()">멈추기</button></div>
      <div class="card"><h3>기록</h3>
        <div class="btns"><button class="ghost sm" onclick="exportCSV()">⬇ CSV</button><button class="ghost sm" onclick="backup()">💾 백업</button>
        <button class="ghost sm" onclick="$('restoreFile').click()">📂 불러오기</button><button class="ghost sm" onclick="resetAll()">🔄 초기화</button>
        <button class="ghost sm" onclick="changeCode()" style="grid-column:1/3">새 수업 코드 만들기</button></div>
        <input type="file" id="restoreFile" accept=".json" class="hide" onchange="restore(this)">
        <div class="muted" style="margin-top:8px;font-size:13px">기록은 이 컴퓨터 브라우저에 자동 저장돼요. 다른 반 수업 전에 [초기화]하세요.</div></div>
    </div>
    <div class="main">
      <div class="tabs" id="tabs">
        <button data-v="help" onclick="setView('help')">🙋 지금 도울 학생</button>
        <button data-v="prob" onclick="setView('prob')">문제별 현황</button>
        <button data-v="twin" onclick="setView('twin')">확인 문제</button>
        <button data-v="bas" onclick="setView('bas')">🧱 기초 연습</button>
        <button data-v="preview" onclick="setView('preview')">힌트·풀이 미리보기</button>
      </div>
      <div id="panel"></div>
    </div>
  </div>
</div>
<div id="big"><button class="ghost close" onclick="closeBig()">닫기 ✕</button><div id="bigBody"></div></div>
<div class="toast" id="toast"></div>

<script>
const APP_VER=20261124.1;            // index.html 과 같은 값이어야 함
const U=window.UNIT, P=U.problems, TW=U.twins, CAUSE=U.causes, G=U.groups, BT=U.basicTypes;
const PBY=Object.fromEntries(P.map(p=>[p.id,p])), TBY=Object.fromEntries(TW.map(t=>[t.id,t])), TOF=Object.fromEntries(TW.map(t=>[t.of,t])), BBY=Object.fromEntries(BT.map(b=>[b.k,b]));
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
function toast(m,ms=2400){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),ms);}
const MK={o:'○',t:'△',x:'×'}, CN=Object.fromEntries(CAUSE.map(c=>[c.k,c.short])), NUM='①②③④';
const STALL_MIN=5;   // 이 시간(분) 동안 진행이 없으면 '도울 학생'에 표시
const SKEY='ur-t2-'+U.id;
const DEF={code:null, wait:60, mode:{}, paused:false, pauseMsg:'선생님을 봐 주세요', recs:{}, view:'help', resetAt:0};
let S=Object.assign({},DEF,LS.get(SKEY,{}));
function save(){ LS.set(SKEY,S); }
function newCode(){ return String(Math.floor(1000+Math.random()*9000)); }
if(!S.code){ S.code=LS.get('ur-t-'+U.id,{}).code||newCode(); save(); }
let LIVE={}, OPEN={}, OFFSET=0;   // LIVE: 서버의 학생 접속 정보 (이름 → p)
$('ttl').textContent='교사용 · '+U.title; document.title='교사용 · '+U.title; $('pauseMsg').value=S.pauseMsg;

/* ---------- 장부 ----------
   classes/{코드}/cfg          ← 이 화면이 씀 (기다리는 시간·문제별 잠금·멈춤·초기화 시각·버전)
   classes/{코드}/stu/{이름}/rec ← 학생이 씀 (기록)
   classes/{코드}/stu/{이름}/p   ← 학생이 씀 (접속 표시·현재 위치)
   S.recs 는 서버 기록을 이 컴퓨터에도 복사해 둔 것 (CSV·백업용)
------------------------------------------------------------ */
function blank(){ return {diag:{},seen:{},hint:{},solved:{},twin:{},bas:{},loc:'',progT:0}; }
function R(name){ return S.recs[name]||blank(); }
function roster(){ return Object.keys(S.recs).sort((a,b)=>a.localeCompare(b,'ko',{numeric:true})); }
function onlineNames(){ const set=new Set(); for(const n in LIVE) if(LIVE[n]&&LIVE[n].online) set.add(n); return set; }
function modeOf(pid){ return S.mode[pid]||'all'; }
function now(){ return Date.now()+OFFSET; }
const FB_OK=!!(window.firebase && window.FB_CONFIG && FB_CONFIG.apiKey && FB_CONFIG.databaseURL);
let db=null, base=null; if(FB_OK){ try{ firebase.initializeApp(FB_CONFIG); db=firebase.database(); }catch(e){ console.error(e); } }
const fbKey=n=>encodeURIComponent(n).replace(/\./g,'%2E');
const fbName=k=>{ try{ return decodeURIComponent(k); }catch(e){ return k; } };
function writeCfg(){ if(!base) return Promise.resolve(); return base.child('cfg').set({wait:S.wait, mode:S.mode, paused:S.paused, pauseMsg:S.pauseMsg, resetAt:S.resetAt||0, ver:APP_VER, t:firebase.database.ServerValue.TIMESTAMP}).catch(e=>{ $('peerErr').textContent='설정 저장 실패: '+e.message; }); }
function pushCfg(){ save(); writeCfg(); render(); }

/* ---------- 연결 ---------- */
function studentURL(){ return location.href.replace(/[?#].*$/,'').replace(/teacher\.html$/,'')+'?c='+S.code; }
function showCode(){ $('code').textContent=S.code; $('url').textContent=studentURL(); $('demoLink').href=studentURL().replace(/\?c=\d+$/,'?demo=1'); }
function copyURL(){ const u=studentURL(); (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('학생 주소를 복사했어요')).catch(()=>{ prompt('학생 주소',u); }); }
function openClass(tries=0){
  if(!FB_OK||!db){ $('badge').textContent='연결 설정 필요'; $('peerErr').textContent='firebase-config.js에 Firebase 설정값이 아직 없어요.'; return; }
  if(base){ try{ base.child('stu').off(); }catch(e){} }
  base=null; LIVE={};
  const code=S.code, ref=db.ref('classes/'+code);
  authReady().then(uid=>ref.child('owner').set(uid).then(()=>{
    if(S.code!==code) return;
    base=ref; writeCfg();
    base.child('stu').on('value',snap=>{ ingest(snap.val()||{}); render(); }, e=>{ $('peerErr').textContent='읽기 실패: '+e.message+' (데이터베이스 규칙을 확인하세요)'; });
  }, e=>{
    if(S.code!==code) return;
    /* 이 코드는 다른 교사 화면(또는 다른 브라우저)이 이미 쓰고 있음 → 새 코드로 */
    if(isDenied(e) && tries<5){ S.code=newCode(); save(); showCode(); toast(`수업 코드 ${code}는 다른 화면에서 쓰고 있어서 새 코드 ${S.code}를 만들었어요`,5000); openClass(tries+1); return; }
    throw e;
  })).catch(e=>{ $('peerErr').textContent=authMsg(e); });
}
/* 익명 로그인: 이 브라우저에 보이지 않는 번호(uid)가 생기고, 이 번호가 수업 코드의 주인이 됨 */
let authP=null;
function authReady(){
  if(!authP) authP=new Promise((res,rej)=>{
    const un=firebase.auth().onAuthStateChanged(u=>{ un();
      if(u) res(u.uid); else firebase.auth().signInAnonymously().then(c=>res(c.user.uid)).catch(e=>{ authP=null; rej(e); }); });
  });
  return authP;
}
function isDenied(e){ return /permission|denied/i.test(String((e&&(e.code||''))+' '+(e&&e.message||''))); }
function authMsg(e){
  const c=String(e&&e.code||'');
  if(/admin-restricted|operation-not-allowed/.test(c)) return '익명 로그인이 꺼져 있어요. Firebase 콘솔 → Authentication → 로그인 방법에서 [익명]을 사용 설정하세요.';
  if(isDenied(e)) return '데이터베이스가 접근을 막았어요: '+e.message+' (데이터베이스 규칙을 확인하세요)';
  return '연결 오류: '+(e&&e.message||e);
}
function startFB(){
  if(!FB_OK||!db){ openClass(); return; }
  db.ref('.info/connected').on('value',s=>{ const on=!!s.val(); $('badge').textContent=on?'● 연결됨':'연결 끊김 · 다시 연결하는 중'; $('badge').classList.toggle('on',on); if(on) $('peerErr').textContent=''; });
  db.ref('.info/serverTimeOffset').on('value',s=>{ OFFSET=+s.val()||0; });
  openClass();
}
/* 서버 기록 → 장부 (값 검사하며 옮김) */
function ingest(all){
  const live={};
  for(const k in all){ const v=all[k]||{}, name=String((v.p&&v.p.name)||fbName(k)).slice(0,10); const p=v.p||{};
    live[name]={online:p.online===true, ver:+p.ver||0, loc:String(p.loc||'').slice(0,30)};
    if(v.rec){ const r=blank(); mergeRec(r,v.rec); r.loc=live[name].loc; r.progT=+v.rec.progT||0; S.recs[name]=r; }
    else if(!S.recs[name]) S.recs[name]=blank();
    S.recs[name].loc=live[name].loc;
  }
  LIVE=live; save();
}
const okPid=pid=>!!PBY[pid], okTid=tid=>!!TBY[tid], okB=k=>!!BBY[k];
function mergeRec(r,x){
  for(const pid in (x.diag||{})) if(okPid(pid)&&['o','t','x'].includes(x.diag[pid])&&!r.diag[pid]) r.diag[pid]=x.diag[pid];
  for(const pid in (x.seen||{})) if(okPid(pid)) r.seen[pid]=true;
  for(const pid in (x.hint||{})) if(okPid(pid)){ const h=r.hint[pid]||{}, y=x.hint[pid]||{}; r.hint[pid]={lv:Math.min(PBY[pid].hints.length,Math.max(h.lv||0,+y.lv||0)), sol:!!(h.sol||y.sol)}; }
  for(const pid in (x.solved||{})) if(okPid(pid)&&!r.solved[pid]){ const y=x.solved[pid]||{}; r.solved[pid]={lv:+y.lv||0,sol:!!y.sol,cause:CN[y.cause]?y.cause:null}; }
  for(const tid in (x.twin||{})) if(okTid(tid)){ const y=x.twin[tid]||{}, cur=Object.assign({},r.twin[tid]); const a=+y.a;
    if(y.open) cur.open=true; if(cur.a==null&&y.a!=null&&a>=0&&a<TBY[tid].ch.length) cur.a=a; if(!cur.cause&&CN[y.cause]) cur.cause=y.cause;
    if(cur.open||cur.a!=null) r.twin[tid]=cur; }
  for(const k in (x.bas||{})) if(okB(k)){ const y=x.bas[k]||{}, cur=r.bas[k]; if(!cur || (+y.n||0)>cur.n){ const ws={}; for(const w in (y.ws||{})) if(/^[0-5]$/.test(w)) ws[w]=+y.ws[w]||0;
      const rc=Array.isArray(y.recent)?y.recent:Object.values(y.recent||{});
      r.bas[k]={n:+y.n||0,ok:+y.ok||0,streak:+y.streak||0,star:!!y.star,recent:rc.slice(-5).map(Boolean),ws}; } }
}

/* ---------- 조작 ---------- */
function setView(v){ S.view=v; save(); render(); }
function togglePause(){ S.paused=!S.paused; S.pauseMsg=$('pauseMsg').value.trim()||'선생님을 봐 주세요'; pushCfg(); }
function setMode(pid,m){ S.mode[pid]=m; pushCfg(); }
function setAllMode(m){ for(const p of P) S.mode[p.id]=m; pushCfg(); }
function setWait(v){ S.wait=+v; pushCfg(); }
function toggleNames(k){ OPEN[k]=!OPEN[k]; render(); }
function unlockName(n){ if(!confirm(`'${n}' 학생이 다른 기기로 들어올 수 있게 할까요?\n(기록은 그대로 이어져요. 지금 쓰던 기기에서는 더 이상 저장되지 않아요)`)) return;
  if(!base) return; base.child('stu/'+fbKey(n)+'/uid').remove().then(()=>toast(`'${n}' 학생이 새 기기에서 같은 이름으로 들어오면 돼요`,4000)).catch(e=>toast('실패: '+e.message)); }
function removeName(n){ if(!confirm(`'${n}' 학생의 기록을 지울까요?`)) return; delete S.recs[n]; save(); if(base) base.child('stu/'+fbKey(n)).remove(); render(); }

/* ---------- 분석 ---------- */
function flagsOf(n){
  const r=R(n), f=[];
  for(const p of P){ const d=r.diag[p.id], h=r.hint[p.id]||{}, sv=r.solved[p.id];
